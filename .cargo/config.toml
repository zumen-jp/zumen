[alias]
xtask = "run --quiet --package xtask --"

# 配る wasm のモジュールから名前のセクションを除き（決定 0252）、固定幅の SIMD（simd128）を有効にする。
# 関数の名前が要る調べものでは、RUSTFLAGS="-C target-feature=+simd128" を指定して作る
[target.wasm32-unknown-unknown]
rustflags = ["-C", "strip=symbols", "-C", "target-feature=+simd128"]

[target.wasm32-wasip1]
rustflags = ["-C", "target-feature=+simd128"]
