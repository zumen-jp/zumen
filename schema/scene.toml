# 2D のシーンの配置（決定 0137・0172・0178）。
#
# `scene` の op が返すシーンの blob は、見出し・区画の表・区画を 1 つのバッファーに並べる。
# `cargo xtask codegen` が、ここから Rust の定数（crates/zumen-scene/src/layout.rs）と、TypeScript・JavaScript の
# 定数と型（bindings/js/src/constants.js・constants.d.ts）と、Python の定数（bindings/python/zumen_provisional/constants.py）
# と、.NET の定数（bindings/dotnet/Zumen.Provisional/Constants.g.cs）と、C・C++ の定数（bindings/c/include/zumen_scene.h）を
# 作る。
#
# - 見出しは `ZMSC`、大版（u16）、小版（u16）、塊の数（u32）、区画の数（u32）。続けて区画ごとに、
#   始まりと長さ（u32、バイト）を置く。数はリトルエンディアン。各区画は 8 バイトの境界に置く。
# - 区画は 1 つの列（型付き配列）で、行ごとに `width` 個の `type` の値を並べる。行の数は、長さを
#   行の大きさで割ったもの。区画の番号は、ここに書いた順で決まる。
# - 新しい区画は後ろに足し、区画の意味は変えない（決定 0015）。区画を足したら小版を上げる。読み手は、
#   知らない区画を読み飛ばす。区画の意味を変えるときは、大版を上げる。
# - 「始まり」の列は、引く先の区画の行の番号で、終わりは次の行の始まり（最後の行なら、引く先の行の
#   数）。番号の「なし」は 4294967295（u32 の最大）。
# - 文字列は `strings` の区画の、始まりと長さ（バイト）の組で引く。
# - 座標は、塊の原点からの相対の f32。切り抜きだけは、起点の座標の f64 で持つ。

[versions]
# 大版。区画の意味を変えるときに上げる
major = 1
# 小版。区画か値を足すたびに上げる
minor = 2

