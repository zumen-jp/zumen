# 図面モデル（L2）のバイナリの型の契約（決定 0247）。
#
# `cargo xtask codegen` が、図面モデル（crates/zumen-drawing）の型から書き、読み書き
# （crates/zumen-drawing/src/binary/generated.rs）を作る。手で直すのは、大版を上げるときだけ。
#
# - 名前のある欄は、並べた順に書く。後の小版で足した欄は後ろに足し、`@` の後ろにその小版を書く
# - 列挙の値の番号は、並べた順（0 から）。後の小版で足した値は後ろに足し、since にその小版を書く
# - 型の書き方は Rust に合わせる。`Cow<str>` は文字列、`P` などは型の引数
# - 欄・値を消すか、名前・型を変えるには、大版を上げる。major を上げ、types を消してから codegen を流す

[versions]
major = 1
minor = 0

[[types]]
name = "Affine"
fields = [
  "m: [f64; 6]",
]

