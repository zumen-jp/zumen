# 境界の版・状態コード・関数（決定 0012・0015）。
#
# `cargo xtask codegen` が、ここから C のヘッダー（bindings/c/include/zumen.h）と、
# Rust の定数と関数の形の検査（crates/zumen-abi/src/abi.rs）を作る。
# 状態コードと関数は足すだけにし、消さず、名前・値・引数・意味を変えない（決定 0015）。

[versions]
# ABI の大版。関数の引数か意味を変えるときに上げる。上げないことを目指す
abi = 1
# メッセージのスキーマ（schema/messages.json）の大版。要求と応答の v
schema-major = 1
# メッセージのスキーマの小版。op・欄・列挙の値を足すたびに上げる
schema-minor = 59

# 状態コード。理由は応答の診断で返す

[[status]]
name = "ok"
value = 0
description = "成功した"

[[status]]
name = "failed"
value = 1
description = "操作が失敗した。応答に error の診断がある"

[[status]]
name = "invalid"
value = 2
description = "引数が使えない（NULL、長さが合わない、使えない名前など）。応答は書かない"

[[status]]
name = "busy"
value = 3
description = "別のスレッドが、同じセッションを使っている"

[[status]]
name = "panicked"
value = 4
description = "コアの不具合で止まった。セッションは閉じるしかない"

# 関数。targets を書かないものは、ネイティブのライブラリと wasm のモジュールの両方が出す

[[functions]]
name = "zm_abi_version"
returns = "u32"
description = "ABI の大版を返す。この関数の形は変えない"

[[functions]]
name = "zm_session_new"
returns = "status"
description = "セッションを作る。設定は JSON（schema/messages.json の session_options）で渡す"
params = [
    { name = "options", type = "bytes", description = "設定の JSON（UTF-8）。長さが 0 なら既定の設定" },
    { name = "options_len", type = "size", description = "設定のバイト数" },
    { name = "session", type = "session_out", description = "作ったセッションを書く所。zm_session_close で閉じる" },
]

[[functions]]
name = "zm_push"
returns = "status"
description = "名前のついた入力に、バイト列を足す。同じ名前で何回か呼ぶと、後ろに足していく"
params = [
    { name = "session", type = "session", description = "セッション" },
    { name = "name", type = "bytes", description = "入力の名前（UTF-8）。/ で区切った相対の名前で、空の部分・.・..・\\・:・NUL を含まない" },
    { name = "name_len", type = "size", description = "名前のバイト数" },
    { name = "data", type = "bytes", description = "足すバイト列。呼び出しの間だけ借りる" },
    { name = "data_len", type = "size", description = "足すバイト数" },
]

[[functions]]
name = "zm_call"
returns = "status"
description = "要求のメッセージを渡し、応答のメッセージを受け取る。前の呼び出しのバイナリの結果は、ここで捨てる"
params = [
    { name = "session", type = "session", description = "セッション" },
    { name = "request", type = "bytes", description = "要求の JSON（UTF-8）" },
    { name = "request_len", type = "size", description = "要求のバイト数" },
    { name = "response", type = "buf", description = "応答の JSON を書く所。状態が ZM_OK・ZM_FAILED・ZM_PANICKED のときに書く。zm_free で返す" },
]

[[functions]]
name = "zm_take"
returns = "status"
description = "直前の zm_call が作ったバイナリの結果を取り出す。取り出したものは、セッションを閉じたあとも使える"
params = [
    { name = "session", type = "session", description = "セッション" },
    { name = "blob", type = "u32", description = "応答の blobs にある番号" },
    { name = "out", type = "buf", description = "結果を書く所。zm_free で返す" },
]

[[functions]]
name = "zm_take_arrow"
returns = "status"
targets = ["native"]
description = "表の結果（種類が arrow のもの）を、Arrow の C Stream Interface で取り出す"
params = [
    { name = "session", type = "session", description = "セッション" },
    { name = "blob", type = "u32", description = "応答の blobs にある番号" },
    { name = "out", type = "arrow_stream", description = "結果を書く所。使い終わったら、その release を呼ぶ" },
]

[[functions]]
name = "zm_cancel"
returns = "void"
description = "動いている呼び出しを止める。どのスレッドからも呼べる。動いている呼び出しがなければ、何もしない"
params = [
    { name = "session", type = "session", description = "セッション" },
]

[[functions]]
name = "zm_session_close"
returns = "void"
description = "セッションを閉じる。NULL なら何もしない。別のスレッドが使っている途中なら閉じない"
params = [
    { name = "session", type = "session", description = "セッション" },
]

[[functions]]
name = "zm_free"
returns = "void"
description = "コアが返したバッファーを返す。返したあとの buf は空になる。空のバッファーと NULL には何もしない"
params = [
    { name = "buf", type = "buf", description = "zm_call・zm_take が書いたバッファー" },
]

[[functions]]
name = "zm_alloc"
returns = "bytes_mut"
targets = ["wasm"]
description = "ホストが要求や入力を書くためのメモリを確保する。長さが 0 なら NULL を返す"
params = [
    { name = "len", type = "size", description = "バイト数" },
]

[[functions]]
name = "zm_dealloc"
returns = "void"
targets = ["wasm"]
description = "zm_alloc で確保したメモリを返す。NULL には何もしない"
params = [
    { name = "ptr", type = "bytes_mut", description = "zm_alloc が返したもの" },
    { name = "len", type = "size", description = "zm_alloc に渡したバイト数" },
]

# wasm のモジュール（決定 0013・0221）。名前は zumen-abi の Cargo の feature の名前でもあり、モジュールは、その feature
# だけを入れて作る。どのモジュールも同じ関数を出し、持たない op には call.op.unsupported を返す。ネイティブのライブラリと
# CLI は、すべての feature を入れる。どの op も、どれかのモジュールに置く。

[[modules]]
name = "drawing"
description = "図面（DXF・DWG・SXF・JWW）と、図面のレビュー。土木の線形（J-LandXML）と、地理の地物（CityGML）。電子納品の成果品・工事写真・表・ボーリング交換用データ"
formats = ["dxf", "dwg", "sxf", "jww", "landxml", "citygml", "las", "ply", "xyz", "e57"]
ops = [
    "capabilities", "open", "close", "describe", "drawing", "entities", "apply", "convert", "tables", "scene",
    "check", "review_carry", "review_adopt", "civil", "pointcloud", "deviation",
    "civil_drawing", "geo", "delivery_check", "photo", "sheet", "boring", "lift",
]

[[modules]]
name = "bim"
description = "IFC と建物モデル、EXPRESS・IDS の照合と BCF"
formats = ["ifc"]
ops = [
    "capabilities", "open", "close", "describe", "validate", "review_carry", "building", "building_elements",
    "ids_check", "review_adopt_ids", "bcf_read", "bcf_write", "building_apply",
]

# プラグインのモジュールの土台（決定 0246）。プラグインの crate と一緒に作り、コアの形式は持たない。読んだ図面は、
# lift で図面モデルのバイナリにして、図面のモジュールの open に渡す
[[modules]]
name = "plugin"
description = "プラグインの図面の形式を読み、図面モデルのバイナリにする"
formats = []
ops = ["capabilities", "open", "close", "describe", "lift"]

# open が入力の形式を判定する順と規則（決定 0007・0219）。規則は、形式のコーデックの SIGNATURES と同じにする
# （zumen-abi の試験が確かめる）。JavaScript の包みは、この順で判定し、形式を持つモジュールを読み込む。
# 規則の形: bytes（offset の位置から続くバイト列）・lines（先頭の行）・step-schema（ISO 10303-21 の FILE_SCHEMA の始まり）・
# xml-root（XML の最初の要素の名前。namespace で名前空間を添える）

[[detection]]
format = "ifc"
module = "bim"
rules = [{ step-schema = "IFC" }]

# LAS・LAZ。範囲で読むので、入力の初めの部分だけで見分ける（決定 0232）
[[detection]]
format = "las"
module = "drawing"
rules = [{ offset = 0, bytes = "LASF" }]

# PLY。XYZ は見分ける印がないので、判定に入れない（決定 0232）
[[detection]]
format = "ply"
module = "drawing"
rules = [{ lines = ["ply"] }]

# E57。全体を渡す
[[detection]]
format = "e57"
module = "drawing"
rules = [{ offset = 0, bytes = "ASTM-E57" }]

[[detection]]
format = "dxf"
module = "drawing"
rules = [{ lines = ["0", "SECTION"] }, { offset = 0, bytes = "AutoCAD Binary DXF\r\n\u001a\u0000" }]

[[detection]]
format = "dwg"
module = "drawing"
rules = [
    { offset = 0, bytes = "AC1012" },
    { offset = 0, bytes = "AC1014" },
    { offset = 0, bytes = "AC1015" },
    { offset = 0, bytes = "AC1018" },
    { offset = 0, bytes = "AC1021" },
    { offset = 0, bytes = "AC1024" },
    { offset = 0, bytes = "AC1027" },
    { offset = 0, bytes = "AC1032" },
]

[[detection]]
format = "sxf"
module = "drawing"
rules = [{ lines = ["ISO-10303-21;"] }]

[[detection]]
format = "jww"
module = "drawing"
rules = [{ offset = 0, bytes = "JwwData." }]

[[detection]]
format = "landxml"
module = "drawing"
rules = [{ xml-root = "LandXML", namespace = "http://www.landxml.org/schema/LandXML-1.2" }]

[[detection]]
format = "citygml"
module = "drawing"
rules = [{ xml-root = "CityModel", namespace = "http://www.opengis.net/citygml/2.0" }]

# ZIP に入れた SXF（SFZ・P2Z）。ifcZIP より前に、書庫の項目の名前で分ける
[[detection]]
format = "sxf"
module = "drawing"
rules = [{ zip-entry = [".p21", ".sfc"] }]

# ifcZIP。ZIP の署名はほかの形式とも重なるので、最後に試す
[[detection]]
format = "ifc"
module = "bim"
rules = [{ offset = 0, bytes = "PK\u0003\u0004" }]
