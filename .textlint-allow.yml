# 表記の検査で誤りとしない語（決定 0021）。.textlintrc.yml と .textlintrc.code.yml から読む。
# 足すときは、理由をコメントに書く。文字列か、/正規表現/ で書く。

# 固有名詞と原典の題名は、空白・長音・送り仮名も含めて原典どおりにする
- "CAD製図基準"
- "/測地成果\\d{4}/"
- "/日本測地系\\d{4}/"
- "/ジオイド\\d{4}(日本とその周辺)?/"
- "ライブラリーコンソーシアム"
- "表示機能及び確認機能要件書"
- "経緯度座標及び平面直角座標相互間の座標換算"
- "土木工事施工管理基準及び規格値"
- "BE-Bridge 等の承継"
- "基準面補正パラメータ"
- "座標補正パラメータファイル"
# 文献の誌名と号の間の空白
- "国土地理院時報 第"

# 誤って判定される語
# 「日本語を正にする」の「正」（正文・正本の意味）。副詞の「まさに」ではない
- "/を正に/"
- "正しく"
# 場所を表す「所」は漢字で書く。形式名詞の「ところ」とは別
- "所"
# 本動詞の「行う」。補助動詞の「いく」ではない
- "残して行った"
