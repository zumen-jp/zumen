# 診断の文（英語）。ja.toml の訳にする（決定 0005・0009）。
# {名前} には台帳の値が、{count} にはまとめた件数が入る。

# 数の書き方。OS のロケールは使わない（決定 0009）
[number]
group-separator = ","
decimal-separator = "."

[codes]
"budget.decoded-bytes.exceeded" = "Stopped: the decoded data exceeds the limit ({limit} bytes)."
"budget.depth.exceeded" = "Stopped: the nesting depth exceeds the limit ({limit})."
"budget.elements.exceeded" = "Stopped: the number of elements created exceeds the limit ({limit})."
"budget.input-bytes.exceeded" = "Not read: the input ({requested} bytes) exceeds the limit ({limit} bytes)."
"budget.records.exceeded" = "Stopped: the number of records read exceeds the limit ({limit})."
"budget.segments.exceeded" = "Stopped: subdividing geometry made more points, segments and faces than the limit ({limit})."
"budget.time.exceeded" = "Stopped: the time limit was reached."
"budget.work.exceeded" = "Stopped: the work exceeds the limit ({limit} steps)."
"call.document.missing" = "There is no document \"{name}\"."
"call.field.missing" = "The request lacks the required field {pointer}."
"call.field.unsupported" = "The request field {pointer} is unknown to this core or not allowed in this form."
"call.format.unsupported" = "Could not detect the format of the input \"{name}\", or this core cannot read it."
"call.input.missing" = "There is no input \"{name}\"."
"call.json.invalid" = "Could not read the request as UTF-8 JSON (at byte offset {offset})."
"call.op.unsupported" = "This core has no op \"{op}\"."
"call.request.cancelled" = "Stopped: the call was cancelled."
"call.value.invalid" = "The type or range of the request value {pointer} is invalid."
"call.version.unsupported" = "This core cannot handle the request version (v = {version})."
"catalog.file.invalid" = "Could not read the input \"{name}\" as a catalog."
"dxf.binary.unsupported" = "Binary DXF cannot be read yet."
"dxf.group-code.missing" = "DXF record {record} has no tag with group code {code}. The changes were not applied."
"dxf.real.unsupported" = "A non-finite real cannot be written to DXF (record {record}, group code {code}). The changes were not applied."
"dxf.record.missing" = "DXF has no record {record}. The changes were not applied."
"dxf.tag.invalid" = "Could not read the DXF tag at line {line}: the group code is not an integer, or the value line is missing."
"dxf.tag.missing" = "DXF record {record} has no tag {tag}. The changes were not applied."
"dxf.value.unsafe" = "A value that would change the DXF tag structure cannot be written (record {record}, group code {code}). Values with line breaks and group code 0 values cannot be changed. The changes were not applied."
"internal.panic.caught" = "Stopped by an internal error. Please report it as a bug."
"zip.path.unsafe" = "Did not use {count} ZIP entry names that are unsafe as paths (the first is \"{name}\")."
