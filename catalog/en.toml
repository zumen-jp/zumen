# 診断の文（英語）。ja.toml の訳にする（決定 0005・0009）。
# {名前} には台帳の値が、{count} にはまとめた件数が入る。

# 数の書き方。OS のロケールは使わない（決定 0009）
[number]
group-separator = ","
decimal-separator = "."

[codes]
