# 診断の code の台帳（決定 0009）。
#
# - code を足したら、ja.toml と en.toml に文を書き、`cargo xtask codegen` を実行する。
# - 一度使った code を、別の意味に使わない。使わなくなった code は、status を "retired" にして残す。

# 出来事の語。code の 3 つ目の部分は、ここから選ぶ。
[events]
unsupported = "扱えないので、読まなかった・書かなかった"
equivalent = "別の表現で、同じ意味のものにした"
approximated = "許容差つきで近似した"
drawn = "見た目だけを残した"
dropped = "落とした"
repaired = "壊れた所を直して読んだ"
assumed = "書かれていないので、既定の値を仮定した"
invalid = "壊れていて読めない"
unsafe = "危ないので、そのまま使わなかった"
exceeded = "予算の上限を超えた"
cancelled = "中断の合図で止めた"
caught = "境界で捕まえた"
missing = "名指ししたものがない"
exists = "名指しした名前が、もう使われている"

# 予算（決定 0010）

[codes."budget.input-bytes.exceeded"]
description = "受け取ったバイト数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.decoded-bytes.exceeded"]
description = "展開・復号で作ったバイト数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.records.exceeded"]
description = "L0・L1 で読んだレコードの数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.elements.exceeded"]
description = "L2・L3 で作った要素の数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.depth.exceeded"]
description = "入れ子と再帰の深さが上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.segments.exceeded"]
description = "幾何の分割で作った点・線・面の数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.work.exceeded"]
description = "ほかの単位に入らない繰り返しの回数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.time.exceeded"]
description = "時間の上限に達した。ネイティブでの補助で、止まる所は環境で変わる"
severity = "error"
since = "0.0.0"
status = "active"

# 呼び出しと境界（決定 0010・0012）

[codes."call.json.invalid"]
description = "要求が UTF-8 の JSON として読めない（文法・重なったキー・深すぎる入れ子・UTF-8 でないバイト）"
severity = "error"
params = { offset = "uint" }
since = "0.0.0"
status = "active"

[codes."call.version.unsupported"]
description = "要求の版 v を、この核が扱えない"
severity = "error"
params = { version = "uint" }
since = "0.0.0"
status = "active"

[codes."call.op.unsupported"]
description = "この核（wasm ではこのモジュール）にない op"
severity = "error"
params = { op = "text" }
since = "0.0.0"
status = "active"

[codes."call.field.unsupported"]
description = "要求に、この核が知らない欄か、この形（wasm など）では使えない欄がある"
severity = "error"
params = { pointer = "text" }
since = "0.0.0"
status = "active"

[codes."call.field.missing"]
description = "要求に、必要な欄がない"
severity = "error"
params = { pointer = "text" }
since = "0.0.0"
status = "active"

[codes."call.value.invalid"]
description = "要求の値の型か範囲が、スキーマに合わない"
severity = "error"
params = { pointer = "text" }
since = "0.0.0"
status = "active"

[codes."call.input.missing"]
description = "名指しした入力がない"
severity = "error"
params = { name = "text" }
group-by = ["name"]
since = "0.0.0"
status = "active"

[codes."call.document.exists"]
description = "開く文書の名前が、もう使われている"
severity = "error"
params = { name = "text" }
group-by = ["name"]
since = "0.0.0"
status = "active"

[codes."call.document.missing"]
description = "名指しした文書がない"
severity = "error"
params = { name = "text" }
group-by = ["name"]
since = "0.0.0"
status = "active"

[codes."call.format.unsupported"]
description = "入力の形式を判定できない。または、この核では読めない形式"
severity = "error"
params = { name = "text" }
since = "0.0.0"
status = "active"

[codes."call.request.cancelled"]
description = "中断の合図を受けて止めた"
severity = "error"
since = "0.0.0"
status = "active"

[codes."internal.panic.caught"]
description = "ネイティブの境界でパニックを捕まえた。不具合なので直す"
severity = "error"
since = "0.0.0"
status = "active"

# カタログ（決定 0009）

[codes."catalog.file.invalid"]
