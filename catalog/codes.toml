# 診断の code の台帳（決定 0009）。
#
# - code を足したら、ja.toml と en.toml に文を書き、`cargo xtask codegen` を実行する。
# - 一度使った code を、別の意味に使わない。使わなくなった code は、status を "retired" にして残す。

# 出来事の語。code の 3 つ目の部分は、ここから選ぶ。
[events]
unsupported = "扱えないので、読まなかった・書かなかった"
equivalent = "別の表現で、同じ意味のものにした"
approximated = "許容差つきで近似した"
drawn = "見た目だけを残した"
dropped = "落とした"
repaired = "壊れた所を直して読んだ"
assumed = "書かれていないので、既定の値を仮定した"
invalid = "壊れていて読めない"
unsafe = "危ないので、そのまま使わなかった"
exceeded = "予算の上限を超えた"
cancelled = "中断の合図で止めた"
caught = "境界で捕まえた"
missing = "名指ししたものがない"
exists = "名指しした名前が、もう使われている"
stale = "読んだときと今とで、名指ししたものが違う"
mixed = "基準・成果の違う値を一緒に使った"

# 予算（決定 0010）

[codes."budget.input-bytes.exceeded"]
description = "受け取ったバイト数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.decoded-bytes.exceeded"]
description = "展開・復号で作ったバイト数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.records.exceeded"]
description = "L0・L1 で読んだレコードの数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.elements.exceeded"]
description = "L2・L3 で作った要素の数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.depth.exceeded"]
description = "入れ子と再帰の深さが上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.segments.exceeded"]
description = "幾何の分割で作った点・線・面の数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.work.exceeded"]
description = "ほかの単位に入らない繰り返しの回数が上限を超えた"
severity = "error"
params = { limit = "uint", requested = "uint" }
since = "0.0.0"
status = "active"

[codes."budget.time.exceeded"]
description = "時間の上限に達した。ネイティブでの補助で、止まる所は環境で変わる"
severity = "error"
since = "0.0.0"
status = "active"

