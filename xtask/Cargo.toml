[package]
name = "xtask"
description = "リポジトリの作業（生成と検査）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# 図面モデルの型の定義を読み、バイナリの読み書きを作る（決定 0247）。MIT OR Apache-2.0。serde の derive がもう使っている
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing"] }
toml = "1.1.8"
# fuzz の種の ZIP に、展開したデータの CRC-32 を書く（#501）
zumen-base = { path = "../crates/zumen-base" }
zumen-json = { path = "../crates/zumen-json" }
zumen-profile = { path = "../crates/zumen-profile" }
# fuzz の種の ZIP を書く（#501）
zumen-zip = { path = "../crates/zumen-zip" }
# SVG の fuzz の合成シーンを、生成した列の配置で作る（#602）
zumen-scene = { path = "../crates/zumen-scene" }
# 旧版の赤入れを移すとき、実際の図面のハッシュと現行のレビュー文書の読み書きを使う（決定 0282）
zumen-drawing = { path = "../crates/zumen-drawing" }
zumen-review = { path = "../crates/zumen-review" }
# ジオイドの格子の補間を、国土地理院のサービスか内挿計算プログラムと照らす（#438）。fuzz の合成の格子の種が
# 読めることも確かめる（#501）
zumen-crs = { path = "../crates/zumen-crs" }

[dev-dependencies]
# fuzz の EXPRESS の種が、fuzz の予算の深さで止まり、長い鎖を読めることを確かめる（#668）
zumen-ifc = { path = "../crates/zumen-ifc", default-features = false }
zumen-sdk = { path = "../crates/zumen-sdk" }
zumen-render = { path = "../crates/zumen-render" }

[lints.rust]
unsafe_code = "forbid"
