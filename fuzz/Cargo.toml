# fuzz の target（#398・#501、決定 0017）。cargo-fuzz で動かす。動かし方と名前の付け方は fuzz/README.md。
# ワークスペースの外に置き、配る成果物には入れない。登録した形式と L0 に target がないと、
# `cargo xtask codegen --check` が落ちる（xtask/src/fuzz.rs）。

[package]
name = "zumen-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# API を通す target（#517）が、関数をセッションで呼ぶため
zumen = { path = "../crates/zumen" }
zumen-acad = { path = "../crates/zumen-acad" }
zumen-base = { path = "../crates/zumen-base" }
zumen-bcf = { path = "../crates/zumen-bcf" }
zumen-building = { path = "../crates/zumen-building" }
zumen-citygml = { path = "../crates/zumen-citygml" }
zumen-civil = { path = "../crates/zumen-civil" }
zumen-crs = { path = "../crates/zumen-crs" }
zumen-delivery = { path = "../crates/zumen-delivery" }
# 図面モデルのバイナリ（決定 0247）を読む target のため
zumen-drawing = { path = "../crates/zumen-drawing", features = ["binary"] }
zumen-e57 = { path = "../crates/zumen-e57" }
zumen-extdm = { path = "../crates/zumen-extdm" }
zumen-fgd = { path = "../crates/zumen-fgd" }
zumen-geo = { path = "../crates/zumen-geo" }
zumen-geology = { path = "../crates/zumen-geology" }
zumen-ids = { path = "../crates/zumen-ids" }
zumen-ifc = { path = "../crates/zumen-ifc" }
zumen-jww = { path = "../crates/zumen-jww" }
zumen-landxml = { path = "../crates/zumen-landxml" }
zumen-las = { path = "../crates/zumen-las" }
zumen-pdf = { path = "../crates/zumen-pdf" }
zumen-photo = { path = "../crates/zumen-photo" }
zumen-ply = { path = "../crates/zumen-ply" }
zumen-pointcloud = { path = "../crates/zumen-pointcloud" }
zumen-sdk = { path = "../crates/zumen-sdk" }
zumen-render = { path = "../crates/zumen-render" }
zumen-review = { path = "../crates/zumen-review" }
zumen-scene = { path = "../crates/zumen-scene" }
zumen-sheet = { path = "../crates/zumen-sheet" }
zumen-step = { path = "../crates/zumen-step" }
zumen-sxf = { path = "../crates/zumen-sxf" }
zumen-xml = { path = "../crates/zumen-xml" }
zumen-xyz = { path = "../crates/zumen-xyz" }
zumen-zip = { path = "../crates/zumen-zip" }

[workspace]
members = ["."]

# API を通す target が使う部品（#517、決定 0262）。target ではないので、xtask/src/fuzz.rs の検査は見ない
[lib]
name = "zumen_fuzz"
path = "src/lib.rs"
test = false
doc = false
bench = false

