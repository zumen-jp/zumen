[workspace]
members = ["crates/*", "bindings/c", "bindings/cli", "bindings/conformance", "templates/plugin", "xtask"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zumen-jp/zumen"
publish = false

# コアの crate の規則（決定 0007・0009・0010）。試験の中の unwrap などは clippy.toml で許す。
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
