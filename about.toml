# 依存のライセンスの文（THIRD_PARTY_LICENSES）を cargo-about で作る設定（決定 0014・0259・0269）。
# 使い方は xtask/release/README.md にある。許すライセンスは deny.toml と合わせる。

accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
]
# 配る成果物に入るものだけを載せる
ignore-build-dependencies = true
ignore-dev-dependencies = true

# 本文を見分けられない crate は、ファイルを指して載せる。crate のバージョンを上げてファイルが変わると、checksum が合わず、
# cargo-about は警告を出して元の扱い（定型の文や標準の本文）に戻る。リリースのワークフローは、この警告で止まるので、
# 中身を見て直す。

# libm の LICENSE.txt は、MIT と Apache-2.0 の本文と、libm と移植元（musl など）の著作権の表示を 1 つのファイルに
# まとめている。cargo-about はこれを MIT の本文と見分けられず、SPDX の定型の文で代えるので、ファイル全体を MIT の文と
# して載せる。
[libm.clarify]
license = "MIT"

[[libm.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "3823dda7cf046602f4b4e77ec8e227863dc4736037cc85bb33d9f19febe16bb7"
