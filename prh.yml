# 表記の揺れの辞書（決定 0021）。考え方と用語集は docs/style.md にある。
#
# - 語を足したら、specs に例を書く。prh は読み込むときに specs を確かめ、合わなければ止まる。
# - Markdown ではコードとリンクの URL を見ない。ソースコードと設定のファイルでは、行をそのまま見る。
#   英語の語の規則は、前後が和文のときだけに当てて、識別子に当たらないようにする。
version: 1
rules:
  # ── カタカナ語の長音 ──

  # 英語の -er・-or・-ar などに当たる語末には「ー」を付ける（内閣告示「外来語の表記」の原則、Microsoft の表記）。
  # 製品名の SXF ブラウザは原典どおりにする。
  - expected: $1ー
    pattern: /(?<!SXF ?)(ブラウザ|コンパイラ|コンテナ|バッファ|ポインタ|デコーダ|エンコーダ|サーバ|フォルダ|ヘッダ|ユーザ|パラメータ|コンピュータ|エディタ|ビューア|ドライバ|プロバイダ|コンバータ|パーサ|レンダラ|ハンドラ|マーカ|アダプタ|コネクタ|フィルタ|モニタ|クラスタ|イテレータ|ジェネレータ|シミュレータ|エミュレータ|プリンタ|スキャナ|ローダ|ビルダ|マネージャ|コントローラ|ラッパ|ヘルパ|メンバ|カウンタ|タイマ|トリガ|セレクタ|オペレータ|ベクタ)(?!ー|リング|ビリティ)/
    prh: 英語の -er・-or・-ar などに当たる語末には「ー」を付けます
    specs:
      - from: ブラウザで読む
        to: ブラウザーで読む
      - from: コンテナとサーバーで動かす
        to: コンテナーとサーバーで動かす
      - from: SXF ブラウザで確かめる
        to: SXF ブラウザで確かめる
      - from: フィルタリングとモニタリングとユーザビリティ
        to: フィルタリングとモニタリングとユーザビリティ

  # CAD製図基準・SXF・Jw_cad の用語に合わせて、レイヤには「ー」を付けない
  - expected: レイヤ
    pattern: レイヤー
    prh: CAD製図基準の用語に合わせて「レイヤ」と書きます
    specs:
      - from: レイヤーの名前とレイヤーグループ
        to: レイヤの名前とレイヤグループ

  # 英語の -y の語末（-ry・-ty・-gy・-xy）には「ー」を付けない
  - expected: $1
    pattern: /(メモリ|ディレクトリ|ライブラリ|リポジトリ|レジストリ|バイナリ|カテゴリ|エントリ|アセンブリ|クエリ|セキュリティ|コミュニティ|プロパティ|ユーティリティ|エンティティ|アイデンティティ|ジオメトリ|トポロジ|テクノロジ|プロキシ)ー/
    prh: 英語の -y の語末には「ー」を付けません
    specs:
      - from: メモリーとライブラリー
        to: メモリとライブラリ

  # ── 漢字とかな ──

  - expected: 分か
    pattern: /わか(?=る|り|ら|れ|っ)/
    prh: 「分かる」「分かれる」は漢字で書きます
    specs:
      - from: わかりやすく書く
        to: 分かりやすく書く
  - expected: ほかの
    pattern: /(?<![一-龠])他の/
    specs:
      - from: 他の人のパッケージ
        to: ほかの人のパッケージ
      - from: 排他的に読む
        to: 排他的に読む
  - expected: よ
    pattern: /(?<![一-龠])良(?=い|く|かっ|けれ)/
    prh: 「よい」「よく」はかなで書きます
    specs:
      - from: 全体にとって良いこと
        to: 全体にとってよいこと
  - expected: すべて
    pattern: 全て
  - expected: または
    pattern: 又は
  - expected: および
    pattern: 及び
  - expected: ならびに
    pattern: 並びに
  - expected: ただし
    pattern: 但し
  - expected: なお、
    pattern: 尚、
  - expected: でき
    pattern: /出来(?=る|ない|ます|ず|た|れば|て)/
    prh: 動詞の「できる」はかなで書きます（出来形・出来高はそのまま）
    specs:
      - from: 出来ない
        to: できない
      - from: 出来形と出来高
        to: 出来形と出来高
  - expected: ください
    pattern: 下さい
  - expected: いただ
    pattern: /(?<![一-龠])頂(?=く|き|け)/
    specs:
      - from: 確かめて頂き
        to: 確かめていただき
  - expected: など
    pattern: /(?<=[ぁ-んァ-ヶー）」A-Za-z0-9] ?)等(?=[、。がをはにのも])/
    prh: 「など」はかなで書きます
    specs:
      - from: SXF・DXF 等を読む
        to: SXF・DXF などを読む
      - from: 同等の意味と等しい長さ
        to: 同等の意味と等しい長さ
  - expected: ため
    pattern: /(?<=[るたいなの])為(?=[にの、。])/
    specs:
      - from: 試験の為に作る
        to: 試験のために作る
      - from: 不適切な行為の例
        to: 不適切な行為の例
  - expected: まで
    pattern: 迄
  - expected: ごと
    pattern: /毎(?=に|の|、|。)/
    specs:
      - from: PR 毎に試験する
        to: PR ごとに試験する
      - from: 毎晩に試験する
        to: 毎晩に試験する

  # ── 英語とカタカナ（どちらで書くかは docs/style.md の用語集で決める）──

  # 後ろに和文が続くときだけに当てる。前が英数字・記号のもの（`Form::native`、`internal.panic.caught`）は識別子とみなす
  - expected: ネイティブ
    pattern: /(?<![A-Za-z0-9_.:/-]) ?native ?(?=[ぁ-んァ-ヶー一-龠々、。・）」])/
    prh: 和文の中では「ネイティブ」と書きます（識別子はコードとして書く）
    specs:
      - from: 同じ入力から、native・wasm・各言語の結合で
        to: 同じ入力から、ネイティブ・wasm・各言語の結合で
      - from: wasm32 と native で同じ結果
        to: wasm32 とネイティブで同じ結果
      - from: native の境界では
        to: ネイティブの境界では
      - from: Form::native のとき
        to: Form::native のとき
  - expected: パニック
    pattern: /(?<![A-Za-z0-9_.:/・-]) ?panic ?(?=[ぁ-んァ-ヶー一-龠々、。）」])/
    prh: 和文の中では「パニック」と書きます（識別子と lint の名前はコードとして書く）
    specs:
      - from: 境界で panic を捕まえた
        to: 境界でパニックを捕まえた
      - from: unwrap・expect・panic・添字を許す
        to: unwrap・expect・panic・添字を許す
  - expected: モジュール
    pattern: /(?<![A-Za-z0-9_.:/-]) ?module ?(?=[ぁ-んァ-ヶー一-龠々、。・）」])/
    prh: 和文の中では「モジュール」と書きます
    specs:
      - from: 埋め込んだ module を配る
        to: 埋め込んだモジュールを配る
      - from: モジュール（module map）
        to: モジュール（module map）
  - expected: crate
    pattern: クレート
  - expected: issue
    pattern: イシュー
  - expected: PR
    pattern: /プルリクエスト|プルリク/
  # 和文の中だけに当てる（列挙子の `Engine::Wasm` などは識別子）。空白は残す
  - expected: wasm
    pattern: /(?<![A-Za-z0-9_.:/-])(?:WASM|Wasm)\b(?= ?[ぁ-んァ-ヶー一-龠々、。・）」])/
    prh: WebAssembly の略は小文字で「wasm」と書きます
    specs:
      - from: WASM のモジュール
        to: wasm のモジュール
      - from: Wasmtime で動かす
        to: Wasmtime で動かす
      - from: Engine::Wasm => "wasm",
        to: Engine::Wasm => "wasm",

  # ── この文書群の用語（docs/style.md の用語集）──

  # Rust の実装は「コア」と書く。中核・核心などの熟語には当てない
  - expected: コア
    pattern: /(?<![中結原])核(?![心家酸融])/
    prh: Rust の実装は「コア」と書きます
    specs:
      - from: 核は人向けの文を返さない
        to: コアは人向けの文を返さない
      - from: 中核の機能と核心
        to: 中核の機能と核心
  # 言語ごとの対応の約束は「Tier」と書く（決定 0006・0257）。段組み・段落・ほかの階層には当てない
  - expected: " Tier $1"
    pattern: /(?<=[ぁ-んァ-ヶー一-龠々])(?:段|階層|ティア) ?([1-3](?![0-9])|[1-3]・[1-3])/
    prh: 言語ごとの対応の約束は「Tier」と書きます（決定 0257）
    specs:
      - from: C は階層 1 の言語
        to: C は Tier 1 の言語
  - expected: Tier $1
    pattern: /(?<![ぁ-んァ-ヶー一-龠々]|[0-9] ?)(?:段|階層|ティア) ?([1-3](?![0-9])|[1-3]・[1-3])/
    prh: 言語ごとの対応の約束は「Tier」と書きます（決定 0257）
    specs:
      - from: （段 2・3 の言語）と 3 段になる
        to: （Tier 2・3 の言語）と 3 段になる
  - expected: "言語の Tier "
    pattern: /言語の(?:段|階層)(?=[ぁ-んァ-ヶー一-龠々])/
    prh: 言語ごとの対応の約束は「Tier」と書きます（決定 0257）
    specs:
      - from: 言語の階層に合わせて配る
        to: 言語の Tier に合わせて配る

  # ── 和語に言い換えない語（決定 0257）──
  # 前後で意味が決まる語（境界・版・欄・見出しなど）は、取り違えのない言い方だけを規則にする

  - expected: ラッパー
    pattern: /包み(?=[をのはがにとでもや）」]|$)/
    prh: 和語に言い換えず「ラッパー」と書きます（決定 0257）
    specs:
      - from: Python の包みと包み方
        to: Python のラッパーと包み方
      - from: JSON を包み、包み込む。包みます
        to: JSON を包み、包み込む。包みます
  - expected: バインディング
    pattern: /(?<=(?:言語の|どの|Python の|Rust の|PyO3 の|wasm の|C\+\+ の))結合(?!セル)/
    prh: 言語から API を呼ぶ層は「バインディング」と書きます（決定 0257）
    specs:
      - from: 各言語の結合と、表の結合セル
        to: 各言語のバインディングと、表の結合セル
  - expected: " API の$1"
    pattern: /(?<=[ぁ-んァ-ヶー一-龠々])境界の( ?)(?=関数|メッセージ|スキーマ|crate|op|バージョン|マイナーバージョン|メジャーバージョン|ラッパー|形態)/
    prh: 各言語からコアを呼ぶ関数とメッセージは「API」と書きます（決定 0257）
    specs:
      - from: 関数と境界の crate
        to: 関数と API の crate
      - from: HATCH の境界の図形
        to: HATCH の境界の図形
  - expected: API の$1
    pattern: /(?<![ぁ-んァ-ヶー一-龠々])境界の( ?)(?=関数|メッセージ|スキーマ|crate|op|バージョン|マイナーバージョン|メジャーバージョン|ラッパー|形態)/
    prh: 各言語からコアを呼ぶ関数とメッセージは「API」と書きます（決定 0257）
    specs:
      - from: 境界の関数、境界のメッセージ
        to: API の関数、API のメッセージ
  - expected: API は足すだけ
    pattern: 境界は足すだけ
  - expected: "$1 API "
    pattern: /(各言語への|ネイティブの)境界(?=[ぁ-んァ-ヶー一-龠々])/
    prh: 各言語からコアを呼ぶ関数とメッセージは「API」と書きます（決定 0257）
    specs:
      - from: 各言語への境界は足すだけ
        to: 各言語への API は足すだけ
  - expected: $1 API
    pattern: /(各言語への|ネイティブの)境界(?![ぁ-んァ-ヶー一-龠々])/
    prh: 各言語からコアを呼ぶ関数とメッセージは「API」と書きます（決定 0257）
    specs:
      - from: 各言語への境界。
        to: 各言語への API。
  - expected: " API $1"
    pattern: /(?<=[ぁ-んァ-ヶー一-龠々])境界(を通(?=す|して|さ)|の呼び出し)/
    prh: 各言語からコアを呼ぶ関数とメッセージは「API」と書きます（決定 0257）
    specs:
      - from: 種を境界の呼び出しで渡す target が境界を通す
        to: 種を API の呼び出しで渡す target が API を通す
      - from: 塗りの境界を通る線
        to: 塗りの境界を通る線
  - expected: API $1
    pattern: /(?<![ぁ-んァ-ヶー一-龠々])境界(を通(?=す|して|さ)|の呼び出し)/
    prh: 各言語からコアを呼ぶ関数とメッセージは「API」と書きます（決定 0257）
    specs:
      - from: 境界を通して呼ぶ。境界の呼び出しの上限
        to: API を通して呼ぶ。API の呼び出しの上限
  - expected: 実行の形態
    pattern: /実行の形(?!態)/
  - expected: ミラーのリポジトリ
    pattern: 鏡のリポジトリ
  - expected: プレイグラウンド
    pattern: 試用画面
  - expected: メジャーバージョン
    pattern: 大版
  - expected: マイナーバージョン
    pattern: 小版
  - expected: バージョン
    pattern: /(?<=(?:どの|パッケージの|スキーマの|コアの|Rust の|API の|ABI の|ツールの|依存の|DWG の|DXF の|形式の|メッセージの))(?<!(?:要領|基準|仕様書|規格)のどの)版(?![元権画])/
    prh: ソフトウェア・形式・スキーマの版は「バージョン」と書きます（要領・基準の版は「版」）（決定 0257）
    specs:
      - from: どの版でも同じ ID を返す
        to: どのバージョンでも同じ ID を返す
      - from: 要領の版と旧版、要領のどの版
        to: 要領の版と旧版、要領のどの版
  - expected: バージョンを$1
    pattern: /版を(固定|上げ)/
    specs:
      - from: 版を固定した Playwright
        to: バージョンを固定した Playwright
  - expected: フィールド
    pattern: /(?<!表題|備考|記入|摘要|空|訂正|縦断図の)欄(?!外)/
    prh: データの項目は「フィールド」と書きます（表題欄・空欄・縦断図の欄はそのまま）（決定 0257）
    specs:
      - from: 型ごとの欄と表題欄
        to: 型ごとのフィールドと表題欄
      - from: 縦断図の欄と訂正欄、欄外
        to: 縦断図の欄と訂正欄、欄外
  - expected: タグ$1
    pattern: /目印(の(?:値|フィールド))/
    prh: タグつきの共用体の目印は「タグ」と書きます（決定 0257）
    specs:
      - from: 目印の値から型を引く
        to: タグの値から型を引く
  - expected: フラグ$1
    pattern: /(?<![矢目])印(を立て|のビット)/
    prh: 値やビットで立てるものは「フラグ」と書きます（決定 0257）
    specs:
      - from: 有理の印を立てる
        to: 有理のフラグを立てる
      - from: 矢印を立てる
        to: 矢印を立てる
  - expected: 既定義のマーカー
    pattern: 既定義の印
  - expected: ヘッダーの$1
    pattern: /見出しの(変数|CRC|区切り|セクション)/
    prh: ファイルとレコードの見出しは「ヘッダー」と書きます（決定 0257）
    specs:
      - from: 見出しの変数
        to: ヘッダーの変数
  - expected: ヘッダー
    pattern: /(?<=(?:フレームの|ZIP の|DWG の|DXF の|JWW の))見出し/
  - expected: ローカルヘッダー
    pattern: 局所の見出し
  - expected: セクション
    pattern: /(?<=(?:シーンの|blob の|名前の|ヘッダーの|オブジェクトの|変数の|コンテナーの|クラスの))(?:区画|区切り)(?!文字|記号)/
    prh: シーンの blob・wasm・DWG のまとまりは「セクション」と書きます（決定 0257）
    specs:
      - from: シーンの区画と、ヘッダーの区切り
        to: シーンのセクションと、ヘッダーのセクション
      - from: CSV の区切りの字と、名前の区切り文字
        to: CSV の区切りの字と、名前の区切り文字
  - expected: セクションの表
    pattern: 区画の表
  - expected: マップ
    pattern: /(?<=(?:オブジェクトの|ページの|セクションの))地図/
    specs:
      - from: オブジェクトの地図と地図の空間
        to: オブジェクトのマップと地図の空間
  - expected: ストリーム
    pattern: /(?<=(?:ハンドルの|文字列の))流れ/
  - expected: コンテナー
    pattern: 入れ物
  - expected: アーカイブ
    pattern: 書庫
  - expected: スタイル
    pattern: /(?<=(?:文字|寸法|マルチライン|引出線))の体裁/
    prh: AutoCAD の日本語版に合わせて「文字スタイル」「寸法スタイル」と書きます（決定 0257）
    specs:
      - from: 文字の体裁と寸法の体裁
        to: 文字スタイルと寸法スタイル
      - from: 文書の表の体裁
        to: 文書の表の体裁
  - expected: フィット点
    pattern: 当てはめる点
  - expected: ノット
    pattern: /節点(?=と制御点|の取り方)|(?<=スプラインの)節点/
    specs:
      - from: 節点と制御点
        to: ノットと制御点
      - from: スプラインの節点の並びと、構造の節点の並び
        to: スプラインのノットの並びと、構造の節点の並び
  - expected: アンダーレイ
    pattern: 下敷き
  - expected: リアクター
    pattern: 反応子
  - expected: 挿入単位
    pattern: 挿す単位
  - expected: マルチライン
    pattern: 多重線
    prh: AutoCAD の日本語版に合わせて「マルチライン」と書きます（決定 0257）
  - expected: リーダー
    pattern: /(?<=(?:シーンの|blob の|DWG の|C\+\+ の))読み手/
  - expected: リーダー
    pattern: 読み取り器
  - expected: ビュー
    pattern: /(?<=(?:型付きの|包む))見方/
  - expected: キー
    pattern: /(?<=(?:形式が持つ|変わらない))鍵/
  - expected: コンポーネント
    pattern: /(?<=(?:建物モデルの|要素の))成分/
  - expected: レジストリ$1
    pattern: /窓口(に登録|に知らせ)/
  # 公開されたサンプルのファイルは「公開サンプル」と書く（決定 0171・docs/style.md の用語集）
  - expected: 公開サンプル
    pattern: 公開の試料
    prh: 公開されたサンプルのファイルは「公開サンプル」と書きます
    specs:
      - from: 再配布を認める公開の試料は見つかっていない
        to: 再配布を認める公開サンプルは見つかっていない
  # 確保したメモリの量の最大は「メモリの最大」と書く。「頂点」は形の点と取り違える
  - expected: メモリの最大
    pattern: /メモリの(頂点|山)/
    prh: 確保したメモリの量の最大は「メモリの最大」と書きます
    specs:
      - from: 読み終えたときのメモリの頂点
        to: 読み終えたときのメモリの最大
      - from: メモリの山を測る
        to: メモリの最大を測る
  - expected: サンプル
    pattern: /(?<!土質|乱さない|乱した|ボーリングの|地盤の|土の)試料(?!採取|番号)/
