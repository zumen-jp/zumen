# 依存の検査（決定 0011）。Cargo の依存は、通常・build・dev のすべてを検査する。

[graph]
all-features = true

[advisories]
ignore = []

# 寛容なライセンスだけを許す。一覧にないものを足すときは、理由を記録する。
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = []
# 一覧は、まだ依存に現れないライセンスも先に許しておく。
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

# 依存は crates.io のものに限る。git の依存は、crates.io に公開できない。
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
