# 工事完成図書の電子納品等要領（令和 8 年 2 月）の、成果品の照合のプロファイル（決定 0138・0241）。
# 要領の表から、照合に要る値（フォルダー・管理ファイル・DTD の名前、名前の文字と長さ、適用要領基準の値）だけを
# 持つ。DTD・作成例・本文は写さない。値の出典は各項の source に書く。DRAWINGF・PHOTO・BORING・ICON の中身は、
# それぞれの基準に従うので、ここでは照らさない。
# この元から、`cargo xtask codegen` が profile.json を作る。

format = "0.1"
id = "mlit-delivery-const"
edition = "2026-02"
revision = 1
title = "工事完成図書の電子納品等要領"
license = "CC-BY-4.0"

[sources.main]
title = "工事完成図書の電子納品等要領"
publisher = "国土交通省"
version = "令和 8 年 2 月"
url = "https://www.cals-ed.go.jp/mg/wp-content/uploads/const_R8.2_1.pdf"
checked = "2026-11-02"

# 名前は半角英数大文字（§3・§6）。ファイルの名前は 8 文字、拡張子は 3 文字が基本で、オリジナルファイルの拡張子は
# 4 文字まで認める（§6）。フォルダーの名前の 8 文字は、規程のフォルダーの名前の長さから選んだ値。BIMCIM の下は
# 名前の規則が違う（図 6-4・6-5）ので除く。
[[rules]]
id = "name"
check = "delivery-name"
level = "warning"
source = { document = "main", section = "6" }
except = ["BIMCIM/", "DRAWINGF/", "DRAWINGS/", "BORING/", "ICON/"]
characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-"
stem = 8
extension = 4
folder = 8

# REGISTER と OTHRS のほかは、ORG の中に階層を作らない（§3）。REGISTER と OTHRS は ORGnnn の下に階層を作らない
# ことを選んだ値とする。
[[rules]]
id = "depth"
check = "delivery-name"
level = "warning"
source = { document = "main", section = "3", basis = "chosen" }
folders = ["PLAN/", "MEET/", "REGISTER/", "OTHRS/"]
depth = 3

[[rules]]
id = "index"
check = "delivery-required"
level = "error"
source = { document = "main", section = "4", item = "表 4-1" }
names = ["INDEX_C.XML"]

[[rules]]
id = "plan"
check = "delivery-required"
level = "error"
source = { document = "main", section = "3" }
when = "PLAN/"
names = ["PLAN/PLAN.XML"]

[[rules]]
id = "meet"
check = "delivery-required"
level = "error"
source = { document = "main", section = "3" }
when = "MEET/"
names = ["MEET/MEET.XML"]

[[rules]]
id = "register"
check = "delivery-required"
level = "error"
source = { document = "main", section = "4", item = "表 4-2" }
when = "REGISTER/"
names = ["REGISTER/REGISTER.XML", "REGISTER/PRE-PIC.JPG", "REGISTER/POST-PIC.JPG"]

[[rules]]
id = "others"
check = "delivery-required"
level = "error"
source = { document = "main", section = "3" }
when = "OTHRS/"
names = ["OTHRS/OTHRS.XML"]

[[rules]]
id = "link"
check = "delivery-link"
level = "error"
source = { document = "main", section = "4" }
folders = ["INDEX_C.XML", "PLAN/", "MEET/", "REGISTER/", "OTHRS/"]

# オリジナルファイルは管理ファイルに名前を書く（表 4-3〜4-5）。どれも指さないファイルを指摘にする。
[[rules]]
id = "unreferenced"
check = "delivery-unreferenced"
level = "warning"
source = { document = "main", section = "4", item = "表 4-3", basis = "chosen" }
folders = ["PLAN/ORG/", "MEET/ORG/", "OTHRS/"]

# 要素の名前は、表 4-1 の項目の名前とする（選んだ値）。
[[rules]]
id = "standard"
check = "delivery-standard"
level = "error"
source = { document = "main", section = "4", item = "表 4-1", basis = "chosen" }
folders = ["INDEX_C.XML"]
element = "適用要領基準"
values = ["土木202602-01"]

# 半角は JIS X 0201 のラテン文字、全角は JIS X 0208 の数字とラテン文字を除く文字（§8-2）。
[[rules]]
id = "characters"
check = "delivery-characters"
level = "warning"
source = { document = "main", section = "8-2" }
folders = ["INDEX_C.XML", "PLAN/", "MEET/", "REGISTER/", "OTHRS/"]
fullwidth-alphanumerics = false

[[rules]]
id = "doctype-index"
check = "delivery-doctype"
level = "error"
source = { document = "main", section = "6" }
folders = ["INDEX_C.XML"]
values = ["INDE_C09.DTD"]

[[rules]]
id = "doctype-plan"
check = "delivery-doctype"
level = "error"
source = { document = "main", section = "6" }
folders = ["PLAN/PLAN.XML"]
values = ["PLAN05.DTD"]

[[rules]]
id = "doctype-meet"
check = "delivery-doctype"
level = "error"
source = { document = "main", section = "6" }
folders = ["MEET/MEET.XML"]
values = ["MEET05.DTD"]

[[rules]]
id = "doctype-register"
check = "delivery-doctype"
level = "error"
source = { document = "main", section = "6" }
folders = ["REGISTER/REGISTER.XML"]
values = ["REGIST06.DTD"]

[[rules]]
id = "doctype-others"
check = "delivery-doctype"
level = "error"
source = { document = "main", section = "6" }
folders = ["OTHRS/OTHRS.XML"]
values = ["OTHRS05.DTD"]
