# 決定 0007・0010 の規則のうち、機械で検査できるもの。

# 試験の中では、unwrap・expect・panic・添字を許す。
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# 精度が決まっていない std の関数は、環境や Rust の版で結果が変わる。libm を使う。
disallowed-methods = [
