# 反復の順が実行ごとに変わる表は使わない。BTreeMap か、挿入の順を保つ表を使う（決定 0007）。
disallowed-types = [
    { path = "std::collections::HashMap", reason = "BTreeMap か、挿入の順を保つ表を使う（決定 0007）" },
    { path = "std::collections::HashSet", reason = "BTreeSet か、挿入の順を保つ集合を使う（決定 0007）" },
]
