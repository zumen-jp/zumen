name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workflows:
    name: ワークフローの検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint の配布物をハッシュで確かめ、すべてのワークフローを検査する
        shell: bash
        run: |
          # actionlint 1.7.12（MIT）。バージョンと配布物の SHA-256 を固定する
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # シェルと Python は対象にせず、環境によらず同じワークフローの規則を検査する
          "$RUNNER_TEMP/actionlint" -color -shellcheck= -pyflakes=

  lint:
    name: 書式・lint・生成物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: L1 だけを使う組（図面モデルなし）も、CP932 の照合のありとなしで lint する
        run: |
          cargo clippy --package zumen-acad --no-default-features --all-targets --locked -- -D warnings
          cargo clippy --package zumen-acad --no-default-features --features cp932 --all-targets --locked -- -D warnings
      - name: 領域モデルなしの PDF と IFC も、lint し、試験を組み立てて流す（#718）
        run: |
          cargo clippy --package zumen-pdf --no-default-features --all-targets --locked -- -D warnings
          cargo clippy --package zumen-ifc --no-default-features --all-targets --locked -- -D warnings
          cargo test --package zumen-pdf --no-default-features --locked
          cargo test --package zumen-ifc --no-default-features --locked
      - name: wasm32 でだけ使うコードも lint する
        run: cargo clippy --package zumen-abi --target wasm32-unknown-unknown --locked -- -D warnings
      - name: 分けた wasm のモジュール（feature を 1 つだけ入れたもの）も lint する（決定 0221）
        run: |
          for module in drawing bim civil pointcloud plugin; do
            cargo clippy --package zumen-abi --target wasm32-unknown-unknown --locked --no-default-features --features $module -- -D warnings
            cargo clippy --package zumen-abi --all-targets --locked --no-default-features --features $module -- -D warnings
          done
      - name: 形式の権利と依存・診断・スキーマ・公開サンプルの台帳を確かめ、生成した文書とコードの更新漏れを調べる
        run: cargo xtask codegen --check

  text:
    name: 表記の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: バージョンを固定したツールを、インストールのスクリプトを走らせずに入れる
        run: npm ci --ignore-scripts
      - name: 文書・コメント・カタログが表記の基準（docs/style.md）に合うかを確かめる（決定 0021）
        run: npm run lint:text

  site:
    name: サイト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7.4 は Node.js 22.23.4 以降を求める。サイトだけのツールなので、ライブラリの下限には合わせない
          node-version: 24
      - name: バージョンを固定したツールを、インストールのスクリプトを走らせずに入れる
        run: npm ci --ignore-scripts
      - name: 型を確かめる
        run: npm run check
      - name: TypeScript・JavaScript のラッパーの型を、サイトと同じバージョンの TypeScript で確かめる（決定 0194）
        run: npx --no-install tsc -p ../bindings/js/tsconfig.json
      - name: Canvas 2D の表示部品の型を確かめる（決定 0267）
        run: npx --no-install tsc -p ../packages/view2d/tsconfig.json
      - name: React のフックの型を確かめる（決定 0267）
        run: npx --no-install tsc -p ../packages/react/tsconfig.json
      - name: zumen.dev のページを作る
        run: npm run build

  test:
    name: 試験（${{ matrix.name }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          # python は、Python のラッパーの適合テストに使うバージョン。docs/support.md の下限（3.9）と最新を、行で分けて試す（決定 0195）
          # dotnet は、.NET のラッパーの適合テストに使う TFM。.NET 10 と、32 bit の .NET Framework 4.8 を試す（決定 0196）
          # Python 3.9 は、Ubuntu 26.04 の setup-python にない。下限を試す行は 24.04 に留める
          - name: Linux x64
            os: ubuntu-24.04
            python: '3.9'
            dotnet: net10.0
            library: libzumen_abi1.so
          - name: macOS arm64
            os: macos-latest
            python: '3.x'
            dotnet: net10.0
            library: libzumen_abi1.dylib
          - name: Windows x64
            os: windows-latest
            python: '3.x'
            dotnet: net10.0
            library: zumen_abi1.dll
          # 32 bit の Office の VBA のため、関数を stdcall で出す（決定 0011・0014）
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            python: '3.9'
            python-architecture: x86
            dotnet: net48
            dotnet-platform: x86
            library: zumen_abi1.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - name: テストする target を入れる
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - run: cargo test --workspace --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Python のラッパーの適合テストに使う Python を入れる
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python-architecture }}
      - name: Python のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0195）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          python bindings/python/tests/conformance.py "target/${{ matrix.target && format('{0}/', matrix.target) || '' }}debug/${{ matrix.library }}"
      - name: .NET のラッパーの適合テストに使う .NET の SDK を入れる
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: .NET のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0196）
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: >-
          dotnet run --project bindings/dotnet/tests/Conformance --framework ${{ matrix.dotnet }}
          ${{ matrix.dotnet-platform && format('-p:PlatformTarget={0}', matrix.dotnet-platform) || '' }}
          -- "target/${{ matrix.target && format('{0}/', matrix.target) || '' }}debug/${{ matrix.library }}"
      - name: DLL が、飾りのない名前で API の関数を出すことを確かめる（VBA の Declare のため）
        if: matrix.target == 'i686-pc-windows-msvc'
        shell: pwsh
        run: |
          cargo build --package zumen-abi --target ${{ matrix.target }} --locked
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $exports = & $dumpbin /nologo /exports "target\${{ matrix.target }}\debug\zumen_abi1.dll"
          $exports
          # 行の形は「ordinal hint RVA 出す名前 = 中の名前」。出す名前を集める
          $exported = $exports | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] } }
          $header = Get-Content bindings/c/include/zumen.h -Raw -Encoding utf8
          $names = [regex]::Matches($header, 'ZM_CALL (zm_\w+)\(') | ForEach-Object { $_.Groups[1].Value }
          if ($names.Count -eq 0) {
            Write-Error "ヘッダーから関数の名前を読めない"
            exit 1
          }
          foreach ($name in $names) {
            if ($exported -notcontains $name) {
              Write-Error "$name を、飾りのない名前で出していない"
              exit 1
            }
          }
          foreach ($name in $exported) {
            if ($names -notcontains $name) {
              Write-Error "ヘッダーにない $name を出している"
              exit 1
            }
          }

  wasm:
    name: wasm32 で適合試験
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: 分けた wasm のモジュールを作り、持つ op と形式だけに答えることを確かめる（決定 0013・0221）
        run: |
          mkdir -p modules
          for module in drawing bim civil pointcloud plugin; do
            cargo test --package zumen-abi --locked --no-default-features --features $module --test modules
            cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked --no-default-features --features $module
            cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_$module.wasm
          done
      - name: ブラウザーに配るのと同じ形で作る（決定 0007）
        run: cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked
      - name: ネイティブと同じハッシュの一覧になることを確かめる
        run: node bindings/conformance/wasm.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: シーンからの SVG・PNG のバイト列・診断・予算・停止が wasm とネイティブで同じことを確かめる（決定 0272・0277）
        run: |
          cargo run --package zumen-render --example export --locked -- target/svg-check
          cargo build --package zumen-render --example parity --target wasm32-unknown-unknown --locked
          node crates/zumen-render/tests/wasm.mjs target/wasm32-unknown-unknown/debug/examples/parity.wasm target/svg-check/transcript.bin
          node crates/zumen-render/tests/api.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: 分けたモジュールをラッパーで読み込み、組に合うモジュールで流しても、同じハッシュの一覧になることを確かめる（決定 0221）
        run: node bindings/js/test/modules.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_drawing.wasm modules/zumen_abi1_bim.wasm modules/zumen_abi1_civil.wasm modules/zumen_abi1_pointcloud.wasm modules/zumen_abi1_plugin.wasm
      - name: プラグインの形式だけを持つ wasm のモジュールを作り、読んだ図面を図面のモジュールで使えることを確かめる（決定 0243・0247）
        run: |
          cargo build --package zumen-plugin-template --lib --target wasm32-unknown-unknown --release --locked
          node templates/plugin/tests/wasm.mjs target/wasm32-unknown-unknown/release/zumen_plugin_template.wasm modules/zumen_abi1_drawing.wasm
      - name: TypeScript・JavaScript のラッパーを通しても、同じハッシュの一覧になることを確かめる（決定 0194）
        run: node bindings/js/test/conformance.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: Node.js の入口・別の realm のモジュール・trap のあとの扱いを、パッケージで確かめる（決定 0259）
        run: node bindings/js/test/server.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: 入力の所有権・旧モジュールへの互換・メモリの削減を確かめる（決定 0271）
        run: node bindings/js/test/input.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: Go の入力の所有権と適合テストに使う下限の Go を入れる（決定 0271）
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: bindings/go/go.sum
      - name: Go の新旧の入力の経路・メモリの削減・適合ハッシュを確かめる
        run: |
          cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm bindings/go/
          test -z "$(gofmt -l bindings/go)"
          go -C bindings/go vet ./...
          go -C bindings/go test -count=1 -v ./...
      - name: worker で大きな図面を読む間のタイマーと、入力・blob の転送を確かめる
        run: node bindings/js/test/worker.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: ブラウザーを動かすツール（Playwright）を、インストールのスクリプトを走らせずに入れる（決定 0199）
        working-directory: bindings/js/test/browser
        run: npm ci --ignore-scripts
      - name: Playwright のバージョンに合う Chromium と、それが使う OS のライブラリを入れる
        working-directory: bindings/js/test/browser
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: ブラウザー（Chromium）の中でラッパーを通しても、同じハッシュの一覧になることを確かめる（決定 0199）
        run: node bindings/js/test/browser/run.mjs chromium target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_drawing.wasm modules/zumen_abi1_bim.wasm modules/zumen_abi1_civil.wasm modules/zumen_abi1_pointcloud.wasm modules/zumen_abi1_plugin.wasm
      - name: 書いた SVG の描画順・字形・切り抜きを Chromium で照合する
        run: node crates/zumen-render/tests/browser.mjs target/svg-check/drawing.svg target/svg-check/region.svg
      - name: Canvas 2D で合成シーンと DXF・JWW・SXF を描く（決定 0267）
        env:
          ZUMEN_PDFJS_REQUIRED: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix xtask/verify/pdfjs
          node bindings/js/test/browser/view2d.mjs chromium target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: React のフックの寿命とプレイグラウンドの操作・通信を Chromium で確かめる
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix playground
          node bindings/js/test/browser/react.mjs chromium modules/zumen_abi1_drawing.wasm
      - name: npm のパッケージを Vite で組み、必要な wasm だけをブラウザーで読み込むことを確かめる（決定 0268）
        run: node bindings/js/test/browser/bundle.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_drawing.wasm modules/zumen_abi1_bim.wasm modules/zumen_abi1_civil.wasm modules/zumen_abi1_pointcloud.wasm

  deny:
    name: 依存の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # rust-toolchain.toml と同じバージョンにする
          rust-version: "1.99.1"
