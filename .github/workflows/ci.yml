name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: 書式・lint・生成物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: L1 だけを使う組（図面モデルなし）も lint する
        run: cargo clippy --package zumen-acad --no-default-features --all-targets --locked -- -D warnings
      - name: wasm32 でだけ使うコードも lint する
        run: cargo clippy --package zumen-abi --target wasm32-unknown-unknown --locked -- -D warnings
      - name: 形式の権利と依存・診断・スキーマ・公開サンプルの台帳を確かめ、生成した文書とコードの更新漏れを調べる
        run: cargo xtask codegen --check

  text:
    name: 表記の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: 版を固定した道具を、インストールのスクリプトを走らせずに入れる
        run: npm ci --ignore-scripts
      - name: 文書・コメント・カタログが表記の基準（docs/style.md）に合うかを確かめる（決定 0021）
        run: npm run lint:text

  site:
    name: サイト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Astro 7.4 は Node.js 22.23.4 以降を求める。サイトだけの道具なので、ライブラリの下限には合わせない
          node-version: 24
      - name: 版を固定した道具を、インストールのスクリプトを走らせずに入れる
        run: npm ci --ignore-scripts
      - name: 型を確かめる
        run: npm run check
      - name: TypeScript・JavaScript の包みの型を、サイトと同じ版の TypeScript で確かめる（決定 0194）
        run: npx --no-install tsc -p ../bindings/js/tsconfig.json
      - name: zumen.dev のページを作る
        run: npm run build

  test:
    name: 試験（${{ matrix.name }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          # python は、Python の包みの適合試験に使う版。docs/support.md の下限（3.9）と最新を、行で分けて試す（決定 0195）
          - name: Linux x64
            os: ubuntu-latest
            python: '3.9'
            library: libzumen_abi1.so
          - name: macOS arm64
            os: macos-latest
            python: '3.x'
            library: libzumen_abi1.dylib
          - name: Windows x64
            os: windows-latest
            python: '3.x'
            library: zumen_abi1.dll
          # 32 bit の Office の VBA のため、関数を stdcall で出す（決定 0011・0014）
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            python: '3.9'
            python-architecture: x86
            library: zumen_abi1.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - name: 試験する target を入れる
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - run: cargo test --workspace --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Python の包みの適合試験に使う Python を入れる
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.python-architecture }}
      - name: Python の包みを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0195）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          python bindings/python/tests/conformance.py "target/${{ matrix.target && format('{0}/', matrix.target) || '' }}debug/${{ matrix.library }}"
      - name: DLL が、飾りのない名前で境界の関数を出すことを確かめる（VBA の Declare のため）
        if: matrix.target == 'i686-pc-windows-msvc'
        shell: pwsh
        run: |
          cargo build --package zumen-abi --target ${{ matrix.target }} --locked
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          $exports = & $dumpbin /nologo /exports "target\${{ matrix.target }}\debug\zumen_abi1.dll"
          $exports
          # 行の形は「ordinal hint RVA 出す名前 = 中の名前」。出す名前を集める
          $exported = $exports | ForEach-Object { if ($_ -match '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\S+)') { $Matches[1] } }
          $header = Get-Content bindings/c/include/zumen.h -Raw -Encoding utf8
          $names = [regex]::Matches($header, 'ZM_CALL (zm_\w+)\(') | ForEach-Object { $_.Groups[1].Value }
          if ($names.Count -eq 0) {
            Write-Error "ヘッダーから関数の名前を読めない"
            exit 1
          }
          foreach ($name in $names) {
            if ($exported -notcontains $name) {
              Write-Error "$name を、飾りのない名前で出していない"
              exit 1
            }
          }
          foreach ($name in $exported) {
            if ($names -notcontains $name) {
              Write-Error "ヘッダーにない $name を出している"
              exit 1
            }
          }

  wasm:
    name: wasm32 で適合試験
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: ブラウザーに配るのと同じ形で作る（決定 0007）
        run: cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked
      - name: ネイティブと同じハッシュの一覧になることを確かめる
        run: node bindings/conformance/wasm.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: TypeScript・JavaScript の包みを通しても、同じハッシュの一覧になることを確かめる（決定 0194）
        run: node bindings/js/test/conformance.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm

  deny:
    name: 依存の検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # rust-toolchain.toml と同じ版にする
          rust-version: "1.99.1"
