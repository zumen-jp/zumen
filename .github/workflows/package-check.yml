name: 配布物の検査

# release.yml と同じ生成・梱包を、公開せずに確かめる（決定 0269）。
on:
  pull_request:
    paths:
      - '.github/workflows/package-check.yml'
      - '.github/workflows/release.yml'
      - 'xtask/release/**'
      - 'about.*'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'bindings/python/**'
      - 'bindings/dotnet/**'
      - 'bindings/js/package.json'
      - 'bindings/js/src/**'
      - 'bindings/js/README.md'
      - 'LICENSE-*'

permissions:
  contents: read

concurrency:
  group: package-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: 対象ごとのライセンス
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - id: targets
        name: 配る target の一覧を読む
        run: echo "targets=$(python xtask/release/package.py targets)" >> "$GITHUB_OUTPUT"
      - name: 梱包の検査で、抜けや違う対象の文を拒むことを確かめる
        run: python -m unittest discover -s xtask/release -p 'test_*.py'
      - name: cargo-about は、バイナリを作る job と分けて動かす
        run: |
          cargo install --locked cargo-about@0.9.2 --features cli
          cargo install --locked cargo-cyclonedx@0.5.9
          python xtask/release/licenses.py --output out
          python xtask/release/sbom.py --output out
      - name: 別 member だけが有効にする feature を、実際のコンパイルと依存の辺から検出する
        run: |
          cargo install --locked cargo-auditable@0.7.7 rust-audit-info@0.5.4
          python xtask/release/check_cargo_scope.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-licenses
          path: out
          if-no-files-found: error

  native:
    name: 配布物（${{ matrix.rid }}）
    needs: licenses
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.licenses.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: linux-tools
        if: matrix.container
        name: manylinux の Python と、固定した Rust のバージョンを選ぶ
        run: |
          # checkout の一時 HOME とは別に、この job へ CI の workspace の許可を渡す。
          taskGitConfigCount=${GIT_CONFIG_COUNT:-0}
          echo "GIT_CONFIG_KEY_$taskGitConfigCount=safe.directory" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_$taskGitConfigCount=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_COUNT=$((taskGitConfigCount + 1))" >> "$GITHUB_ENV"
          echo /opt/python/cp314-cp314/bin >> "$GITHUB_PATH"
          /opt/python/cp314-cp314/bin/python -c 'import tomllib; print("toolchain=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - name: manylinux の Git が作業フォルダーを読めることを確かめる
        if: matrix.container
        run: |
          git --version
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          git --no-optional-locks status --porcelain --untracked-files=no
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: matrix.container
        with:
          toolchain: ${{ steps.linux-tools.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
        if: ${{ !matrix.container }}
      - run: cargo install --locked cargo-auditable@0.7.7 rust-audit-info@0.5.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !matrix.container }}
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-licenses
          path: licenses
      - name: ネイティブ・CLI の圧縮・wheel に入る本文とバイナリを確かめる
        run: python xtask/release/build.py --rid ${{ matrix.rid }} --out built
      - name: 配布ファイルの SBOM と埋込情報を照合する
        run: >-
          python xtask/release/package.py native --rid ${{ matrix.rid }}
          --built built --licenses licenses --out out
      - name: manylinux の .NET の実行に使うライブラリを入れる
        if: matrix.container
        run: dnf -y install libicu krb5-libs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.container
        with:
          dotnet-version: '10.0.x'
      - name: glibc 2.28 で、梱包対象のライブラリ・CLI・wheel の実行を確かめる
        if: matrix.container
        run: python xtask/release/check_linux_runtime.py --rid ${{ matrix.rid }} --built built --packages out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-native-${{ matrix.rid }}
          path: out
          if-no-files-found: error

  wasm:
    name: wasm の 5 対象
    needs: licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
          cargo install --locked cargo-auditable@0.7.7 rust-audit-info@0.5.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-licenses
          path: licenses
      - run: python xtask/release/build.py --rid wasm --out built
      - run: python xtask/release/package.py wasm --built built --licenses licenses --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-wasm
          path: out
          if-no-files-found: error

  packages:
    name: npm と NuGet の配布物
    needs: [licenses, native, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - run: cargo install --locked rust-audit-info@0.5.4
      - run: python xtask/release/package.py nuget --artifacts artifacts --out out
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: python xtask/release/package.py npm --artifacts artifacts --out out
