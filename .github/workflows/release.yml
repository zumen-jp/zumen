name: Release

# v で始まるタグ（例: v0.2.0）を push すると、対象ごとに作り、GitHub の Release に置き、
# crates.io・npm・PyPI・NuGet に出す（決定 0205）。手で走らせると、作るところまでを確かめる（出さない）。
# 出すところは、それぞれのレジストリの trusted publishing（OIDC）で認証する。NuGet だけは、
# アカウントの名前を変数 NUGET_USER に置く。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # crates.io に出す順。依存される側が先（決定 0205）
  CRATES: >-
    -p zumen-json -p zumen-base -p zumen-sdk -p zumen-crs -p zumen-step -p zumen-geom2d -p zumen-drawing -p zumen-acad
    -p zumen-jww -p zumen-sxf -p zumen-xml -p zumen-scene -p zumen-profile -p zumen-abi -p zumen -p zumen-cli

jobs:
  version:
    name: タグと版を合わせる
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Cargo.toml の版を読み、タグで走ったときはタグと同じことを確かめる
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "タグ $GITHUB_REF_NAME と Cargo.toml の版 $version が違う"
            exit 1
          fi

  native:
    name: 作る（${{ matrix.rid }}）
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # rid は .NET の runtime identifier、wheel は wheel のプラットフォームのタグ
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, rid: linux-x64, wheel: manylinux_2_35_x86_64, library: libzumen_abi1.so, exe: zumen }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, rid: linux-arm64, wheel: manylinux_2_35_aarch64, library: libzumen_abi1.so, exe: zumen }
          - { os: macos-latest, target: aarch64-apple-darwin, rid: osx-arm64, wheel: macosx_11_0_arm64, library: libzumen_abi1.dylib, exe: zumen }
          - { os: macos-latest, target: x86_64-apple-darwin, rid: osx-x64, wheel: macosx_10_12_x86_64, library: libzumen_abi1.dylib, exe: zumen }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rid: win-x64, wheel: win_amd64, library: zumen_abi1.dll, exe: zumen.exe }
          # 32 bit の Office の VBA のため（決定 0011・0014）
          - { os: windows-latest, target: i686-pc-windows-msvc, rid: win-x86, wheel: win32, library: zumen_abi1.dll, exe: zumen.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, rid: win-arm64, wheel: win_arm64, library: zumen_abi1.dll, exe: zumen.exe }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust と、作る target を入れる
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: ネイティブのライブラリと CLI を作る
        run: cargo build --release --locked --target ${{ matrix.target }} -p zumen-abi -p zumen-cli
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: 配るものを out に集める（ライブラリ・CLI の圧縮・wheel）
        run: |
          built=target/${{ matrix.target }}/release
          mkdir -p out/native/${{ matrix.rid }} out/wheels
          cp "$built/${{ matrix.library }}" out/native/${{ matrix.rid }}/
          name=zumen-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          mkdir -p "$name"
          cp "$built/${{ matrix.exe }}" README.md LICENSE-MIT LICENSE-APACHE "$name"/
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "out/$name.zip" "$name" > /dev/null
          else
            tar -czf "out/$name.tar.gz" "$name"
          fi
          python bindings/python/build_wheel.py "$built/${{ matrix.library }}" ${{ matrix.wheel }} out/wheels
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: out
          if-no-files-found: error

  wasm:
    name: 作る（wasm）
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust と、wasm32 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: cargo build --release --locked --target wasm32-unknown-unknown -p zumen-abi
      - name: crates.io に出す crate を、依存の順に包めることを確かめる
        run: cargo publish --dry-run --locked $CRATES
      - run: |
          mkdir -p out
          cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: out
          if-no-files-found: error

  packages:
    name: npm と NuGet の包みを作る
    needs: [version, native, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: npm の包みに wasm を入れて包む
        run: |
          cp artifacts/zumen_abi1.wasm bindings/js/
          mkdir -p out
          (cd bindings/js && npm pack --pack-destination ../../out)
      - name: NuGet のパッケージに、対象ごとのネイティブのライブラリを入れて包む
        run: |
          for rid in $(ls artifacts/native); do
            mkdir -p bindings/dotnet/Zumen/runtimes/$rid/native
            cp artifacts/native/$rid/* bindings/dotnet/Zumen/runtimes/$rid/native/
          done
          dotnet pack bindings/dotnet/Zumen/Zumen.csproj -c Release -o out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out
          if-no-files-found: error

  release:
    name: GitHub の Release に置く
    if: github.ref_type == 'tag'
    needs: [version, native, wasm, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: 置くものを 1 つのディレクトリに集める
        run: |
          mkdir -p files
          cp artifacts/*.tar.gz artifacts/*.zip artifacts/zumen_abi1.wasm artifacts/wheels/*.whl artifacts/*.tgz artifacts/*.nupkg files/
          for rid in $(ls artifacts/native); do
            for f in artifacts/native/$rid/*; do cp "$f" "files/$rid-$(basename "$f")"; done
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/*
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  crates-io:
    name: crates.io に出す
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked $CRATES
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: npm に出す
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish packages/*.tgz --access public --provenance

  pypi:
    name: PyPI に出す
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifacts/wheels

  nuget:
    name: NuGet に出す
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push packages/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
