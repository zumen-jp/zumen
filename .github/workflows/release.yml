name: Release

# v で始まるタグ（例: v0.2.0）を push すると、対象ごとに作り、GitHub の Release に置き、
# crates.io・npm・PyPI・NuGet に出す（決定 0205）。入力なしの手動実行は、作るところまでを確かめる。
# npm_retry_tag を指定した手動実行は、許可した既存の npm 配布物だけを再公開する（決定 0294）。
# 出すところは、それぞれのレジストリの trusted publishing（OIDC）で認証する。NuGet だけは、
# アカウントの名前を変数 NUGET_USER に置く。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      npm_retry_tag:
        description: 'npm だけを再試行する既存タグ（空なら公開しない試運転）'
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # crates.io に出す crate（決定 0205）。cargo publish は、渡した順によらず依存される側から出す（Cargo 1.90 から）。
  # 足し忘れは cargo xtask codegen --check が確かめる
  CRATES: >-
    -p zumen-json -p zumen-base -p zumen-sdk -p zumen-crs -p zumen-step -p zumen-geom2d -p zumen-geom3d -p zumen-drawing -p zumen-acad
    -p zumen-jww -p zumen-sxf -p zumen-xml -p zumen-zip -p zumen-photo -p zumen-geology -p zumen-building -p zumen-ids -p zumen-civil -p zumen-ifc -p zumen-review -p zumen-bcf -p zumen-civil-drawing -p zumen-landxml -p zumen-geo -p zumen-citygml -p zumen-extdm -p zumen-fgd -p zumen-geojson -p zumen-pointcloud -p zumen-las -p zumen-ply -p zumen-xyz -p zumen-e57
    -p zumen-scene -p zumen-text -p zumen-render -p zumen-profile -p zumen-delivery -p zumen-asbuilt -p zumen-abi -p zumen -p zumen-cli

jobs:
  version:
    if: inputs.npm_retry_tag == ''
    name: タグとバージョンを合わせる
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        name: Cargo.toml のバージョンを読み、タグで走ったときはタグと同じことを確かめる
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "タグ $GITHUB_REF_NAME と Cargo.toml のバージョン $version が違う"
            exit 1
          fi

  native:
    name: 作る（${{ matrix.rid }}）
    needs: [version, licenses]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.licenses.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: linux-tools
        if: matrix.container
        name: manylinux の Python と、固定した Rust のバージョンを選ぶ
        run: |
          # checkout の一時 HOME とは別に、この job へ CI の workspace の許可を渡す。
          taskGitConfigCount=${GIT_CONFIG_COUNT:-0}
          echo "GIT_CONFIG_KEY_$taskGitConfigCount=safe.directory" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_$taskGitConfigCount=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_COUNT=$((taskGitConfigCount + 1))" >> "$GITHUB_ENV"
          echo /opt/python/cp314-cp314/bin >> "$GITHUB_PATH"
          /opt/python/cp314-cp314/bin/python -c 'import tomllib; print("toolchain=" + tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])' >> "$GITHUB_OUTPUT"
      - name: manylinux の Git が作業フォルダーを読めることを確かめる
        if: matrix.container
        run: |
          git --version
          test "$(git rev-parse --show-toplevel)" = "$GITHUB_WORKSPACE"
          git --no-optional-locks status --porcelain --untracked-files=no
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: matrix.container
        with:
          toolchain: ${{ steps.linux-tools.outputs.toolchain }}
          targets: ${{ matrix.target }}
      - name: rust-toolchain.toml のバージョンの Rust と、作る target を入れる
        if: ${{ !matrix.container }}
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - run: cargo install --locked cargo-auditable@0.7.7 rust-audit-info@0.5.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: ${{ !matrix.container }}
        with:
          python-version: '3.x'
      - run: python xtask/release/build.py --rid ${{ matrix.rid }} --out built
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: licenses
      - name: 配るものを out に集める（ライブラリ・CLI の圧縮・wheel）
        run: >-
          python xtask/release/package.py native --rid ${{ matrix.rid }}
          --built built --licenses licenses --out out
      - name: manylinux の .NET の実行に使うライブラリを入れる
        if: matrix.container
        run: dnf -y install libicu krb5-libs
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.container
        with:
          dotnet-version: '10.0.x'
      - name: glibc 2.28 で、梱包対象のライブラリ・CLI・wheel の実行を確かめる
        if: matrix.container
        run: python xtask/release/check_linux_runtime.py --rid ${{ matrix.rid }} --built built --packages out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.rid }}
          path: out
          if-no-files-found: error

  wasm:
    name: 作る（wasm）
    needs: [version, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、wasm32 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - run: cargo install --locked cargo-auditable@0.7.7 rust-audit-info@0.5.4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: licenses
          path: licenses
      - run: python xtask/release/build.py --rid wasm --out built
      - run: python xtask/release/package.py wasm --built built --licenses licenses --out out
      - name: crates.io に出す crate を、依存の順に包めることを確かめる
        run: cargo publish --dry-run --locked $CRATES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm
          path: out
          if-no-files-found: error

  licenses:
    name: ライセンスの文を作る
    # cargo-about と、その依存の build script が、配るバイナリに触れないよう、作る job と分ける（決定 0259・0269）
    needs: version
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - id: targets
        name: 配る target の一覧を読む
        run: echo "targets=$(python xtask/release/package.py targets)" >> "$GITHUB_OUTPUT"
      - name: crate・target ごとのライセンス本文を作り、警告・定型の文・抜けを検査する
        run: |
          cargo install --locked cargo-about@0.9.2 --features cli
          cargo install --locked cargo-cyclonedx@0.5.9
          python xtask/release/licenses.py --output out
          python xtask/release/sbom.py --output out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: licenses
          path: out
          if-no-files-found: error

  packages:
    name: npm と NuGet のパッケージを作る
    needs: [version, native, wasm, licenses]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - run: cargo install --locked rust-audit-info@0.5.4
      - name: npm に wasm と SBOM とライセンス本文を入れ、梱包後の依存を照合する
        run: python xtask/release/package.py npm --artifacts artifacts --out out
      - name: NuGet のパッケージに、対象ごとのネイティブのライブラリを入れて包む
        run: python xtask/release/package.py nuget --artifacts artifacts --out out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out
          if-no-files-found: error

  release:
    name: GitHub の Release に置く
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, native, wasm, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: 置くものを 1 つのディレクトリに集める
        run: |
          mkdir -p files
          cp artifacts/*.tar.gz artifacts/*.zip artifacts/zumen_abi1.wasm artifacts/zumen_abi1_drawing.wasm artifacts/zumen_abi1_bim.wasm artifacts/zumen_abi1_civil.wasm artifacts/zumen_abi1_pointcloud.wasm artifacts/THIRD_PARTY_LICENSES artifacts/wheels/*.whl artifacts/*.tgz artifacts/*.nupkg files/
          for rid in $(ls artifacts/native); do
            for f in artifacts/native/$rid/*; do cp "$f" "files/$rid-$(basename "$f")"; done
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/*
      - name: Release を作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  crates-io:
    name: crates.io に出す
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish --locked $CRATES
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  npm:
    name: npm に出す
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm publish ./packages/*.tgz --access public --provenance

  pypi:
    name: PyPI に出す
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: artifacts/wheels

  nuget:
    name: NuGet に出す
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: dotnet nuget push packages/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  npm-retry:
    name: 既存の npm 配布物を再公開する
    if: github.event_name == 'workflow_dispatch' && inputs.npm_retry_tag != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      attestations: read
      id-token: write
    steps:
      - name: main からの再試行だけを許す
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = zumen-jp/zumen
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: 元のタグ・配布物・来歴を照合し、未公開であることを確かめる
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_RETRY_TAG: ${{ inputs.npm_retry_tag }}
        run: python xtask/release/retry_npm.py "$NPM_RETRY_TAG" --out ./packages
      - run: npm publish ./packages/zumen-jp-zumen-0.2.0.tgz --ignore-scripts --access public --provenance
