name: 毎晩

on:
  schedule:
    # 毎日 3:00（日本時間）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ply:
    name: PLY の読みを ply-rs と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - name: 公開サンプルと合成の座標・属性、診断と予算を照らす
        run: cargo test --package zumen-ply --test external --locked

  landxml:
    name: 公開 J-LandXML の TIN を原本と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 公開 Rust API の TIN を出すツールを作る
        run: cargo build --locked -p zumen-landxml --example tin_probe
      - name: 農林水産省のほ場整備整地工・道路工の頂点と面を比較する
        run: |
          cd "$RUNNER_TEMP"
          for file in 01_hojo-seichi.xml 02_douro-keihan.xml; do
            curl --fail --silent --show-error --location --retry 3 -o "$file" "https://www.maff.go.jp/j/nousin/sekkei/$file"
          done
          echo 'dd5f47f8aa1724cd93fae451322967c437b7c8b1da955f3f1e8aea6a68e2e97c  01_hojo-seichi.xml' | sha256sum --check
          echo 'bec7804e5394bf348b42546e6889bd2a7752ccd4ce92cec423a9b238f77c2c9a  02_douro-keihan.xml' | sha256sum --check
          python3 "$GITHUB_WORKSPACE/xtask/verify/landxml/compare_public_tin.py" "$GITHUB_WORKSPACE/target/debug/examples/tin_probe" 01_hojo-seichi.xml 02_douro-keihan.xml

  citygml:
    name: 公開 PLATEAU の地物と座標を照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: 公開 Rust API で地物の ID・LOD・面・頂点を出す
        run: |
          rustup target add wasm32-wasip1
          cargo build --locked -p zumen-citygml --example plateau_probe
          cargo build --locked -p zumen-citygml --example plateau_probe --target wasm32-wasip1
      - name: 公開原本 4 件を XML と照らし、土地利用と浸水を GDAL で読む
        run: |
          python -m pip install --only-binary :all: pyogrio==0.13.0 shapely==2.2.0 numpy==2.5.4
          cd "$RUNNER_TEMP"
          verify="$GITHUB_WORKSPACE/xtask/verify/citygml"
          probe="$GITHUB_WORKSPACE/target/debug/examples/plateau_probe"
          base='https://raw.githubusercontent.com/Project-PLATEAU/PLATEAU-GIS-Converter/e1c8feff7d8ff3e132230d6c21eaed4879e4a235/nusamai-plateau/tests/data'
          files=()
          while read -r digest file; do
            mkdir -p "$(dirname "$file")"
            curl --fail --silent --show-error --location --retry 3 -o "$file" "$base/$file"
            files+=("$file")
          done < "$verify/plateau.sha256"
          sha256sum --check "$verify/plateau.sha256"
          python -I "$verify/compare_plateau.py" --wasm "$GITHUB_WORKSPACE/target/wasm32-wasip1/debug/examples/plateau_probe.wasm" "$probe" "${files[@]}"
          python -I "$verify/compare_plateau.py" --gdal "$probe" numazu-shi/udx/luse/*.gml numazu-shi/udx/fld/*.gml

  browser:
    name: ブラウザーで適合テスト（Firefox・WebKit）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 24
      - name: 分けた wasm のモジュールを作る（決定 0221）
        run: |
          mkdir -p modules
          for module in drawing bim civil pointcloud plugin; do
            cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked --no-default-features --features $module
            cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_$module.wasm
          done
      - name: ブラウザーに配るのと同じ形で作る（決定 0007）
        run: cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked
      - name: ブラウザーを動かすツール（Playwright）を、インストールのスクリプトを走らせずに入れる（決定 0199）
        working-directory: bindings/js/test/browser
        run: npm ci --ignore-scripts
      - name: Playwright のバージョンに合うブラウザーと、それが使う OS のライブラリを入れる
        working-directory: bindings/js/test/browser
        run: npx --no-install playwright install --with-deps firefox webkit
      - name: 表示部品とプレイグラウンドのテストに使う依存を入れる
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix xtask/verify/pdfjs
          npm ci --ignore-scripts --no-audit --no-fund --prefix playground
      - name: 同じ wasm で両ブラウザーの適合テスト・表示部品・React を確かめる
        env:
          ZUMEN_PDFJS_REQUIRED: '1'
        run: |
          wasm=target/wasm32-unknown-unknown/release/zumen_abi1.wasm
          modules=(modules/zumen_abi1_{drawing,bim,civil,pointcloud,plugin}.wasm)
          status=0
          for browser in firefox webkit; do
            node bindings/js/test/browser/run.mjs "$browser" "$wasm" "${modules[@]}" || status=1
            node bindings/js/test/browser/view2d.mjs "$browser" "$wasm" || status=1
            node bindings/js/test/browser/react.mjs "$browser" modules/zumen_abi1_drawing.wasm || status=1
          done
          exit "$status"

  site:
    name: サイトをブラウザーで確認（Firefox・WebKit）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: サイトの検査用の依存を、インストールのスクリプトを走らせずに入れる
        run: npm ci --ignore-scripts
      - name: サイトのページとビューアーを組む
        run: npm run build
      - name: サイトの Playwright に合うブラウザーと OS のライブラリを入れる
        run: npx --no-install playwright install --with-deps firefox webkit
      - name: サイトの表示・保存・CSP による通信の拒否を確かめる
        run: |
          status=0
          for browser in firefox webkit; do
            npm run test:browser -- "$browser" || status=1
          done
          exit "$status"

  svg:
    name: SVG・PNG を Chromium で開いて照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: 既存の Playwright を、インストールのスクリプトを走らせずに入れる
        working-directory: bindings/js/test/browser
        run: npm ci --ignore-scripts
      - name: Playwright のバージョンに合う Chromium と OS のライブラリを入れる
        working-directory: bindings/js/test/browser
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: シーンから SVG・PNG の照合用のファイルを作る（決定 0272・0277）
        run: cargo run --locked -p zumen-render --example export -- target/svg-check
      - name: SVG・PNG の描画順・穴・字形・切り抜きを外部の実装と照らす（決定 0254）
        run: node crates/zumen-render/tests/browser.mjs target/svg-check/drawing.svg target/svg-check/region.svg

  nextjs:
    name: Next.js のサーバー側でパッケージを使う
    # npm pack したパッケージを、Turbopack（設定なし）と webpack（serverExternalPackages）で standalone に組み、API ルートで
    # 図面を開く（決定 0259）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 24
      - name: npm で配るのと同じ形で作る（決定 0205）
        run: cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked
      - name: Next.js と React を、インストールのスクリプトを走らせずに入れる
        working-directory: bindings/js/test/nextjs
        run: npm ci --ignore-scripts
      - name: Turbopack と webpack で組み、組んだサーバーの API ルートで公開サンプルの DXF を開く
        run: node bindings/js/test/nextjs/run.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm

  tier3:
    name: CLI・HTTP・WASI の適合テストと Tier 3 のサンプル
    # Tier 3 の言語が使う形態を、言語に依らないテストのツール（bindings/conformance/cli.mjs）で流す（決定 0006・0013・0200、#403）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、wasm32-wasip1 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 24
      - name: 適合テストとサンプルで使う C ABI と、ネイティブ・WASI の CLI を作る
        id: build
        run: |
          cargo build --release --locked -p zumen-abi -p zumen-cli
          cargo build --release --locked -p zumen-cli --target wasm32-wasip1
      - name: zumen call・serve --stdio・serve --http で流し、hashes.txt と一致することを確かめる
        run: |
          for mode in call stdio http; do
            node bindings/conformance/cli.mjs $mode target/release/zumen
          done
      - name: WASI のランタイム（node:wasi）の上の serve --stdio で流し、hashes.txt と一致することを確かめる
        run: node bindings/conformance/cli.mjs wasi target/wasm32-wasip1/release/zumen.wasm
      - name: Tier 3 の 4 つの形のサンプルを流し、expected.txt と照らす
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          drawing=samples/dwg/zumen-layout-r2000_ascii.dxf
          expected=examples/tier3/expected.txt
          ruby examples/tier3/ruby/c_abi.rb target/release/libzumen_abi1.so $drawing | diff $expected -
          php examples/tier3/php/stdio.php $drawing target/release/zumen serve --stdio | diff $expected -
          php examples/tier3/php/stdio.php $drawing node bindings/conformance/wasi.mjs target/wasm32-wasip1/release/zumen.wasm serve --stdio | diff $expected -
          pwsh examples/tier3/powershell/http.ps1 -Zumen target/release/zumen -Drawing $drawing | diff $expected -

  ifcopenshell:
    name: IFC を IfcOpenShell で開いて照らす
    # 書いたファイルと、公開サンプルの建物モデルへの写し方を、zumen でない IFC を読むソフトで確かめる
    # （決定 0244、#482・#412）。IfcOpenShell はテストのツールで、依存にしない
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: IfcOpenShell と、EXPRESS の規則の検査が使う pytest を、バージョンを決めて入れる
        run: |
          python -m pip install --only-binary :all: ifcopenshell==0.9.0.post1 pytest==9.2.0
      - name: EXPRESS の実行時観測に使うテストをビルドする
        run: cargo test --locked -p zumen-ifc --lib --no-run
      - name: EXPRESS 比較器の反例と子プロセスの正常終了を確かめる
        run: python -I -m unittest discover -s xtask/verify/express -p 'test_*.py'
      - name: 公開 EXPRESS 3版の宣言を同じ入力から読んで照らす
        run: python -I xtask/verify/express/check.py --out "$RUNNER_TEMP/express-observations"
      - name: 公開 validate を呼ぶ CLI をビルドする
        run: cargo build --locked -p zumen-cli --bin zumen
      - name: 公開 IFC の指摘と逆属性・ヘッダー・規則の対象範囲の差を照らす
        run: python -I xtask/verify/express/validate.py --cli target/debug/zumen --out "$RUNNER_TEMP/express-validation"
      - name: 公開 IFC を編集し、実機用の期待値と CLI の比較器を確かめる
        env:
          ZUMEN_CLI: target/debug/zumen
        run: |
          python -I -m unittest discover -s xtask/verify/ifc -p 'test_*.py'
          python -I xtask/verify/ifc/make.py make target/debug/zumen "$RUNNER_TEMP/ifc-edit-check"
      - name: 書き戻した公開 IFC の値・型・非対象の属性と参照を IfcOpenShell と照らす
        id: ifc_kit_check
        run: |
          python -I xtask/verify/ifc/external/check.py "$RUNNER_TEMP/ifc-edit-check" --cli target/debug/zumen
          python -I xtask/verify/ifc/external/test_check.py "$RUNNER_TEMP/ifc-edit-check"
      - name: 外部照合を終えた IFC の実機用キットを保存する
        if: ${{ !cancelled() && steps.ifc_kit_check.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-ifc-edit
          path: ${{ runner.temp }}/ifc-edit-check
          retention-days: 30
      - name: EXPRESS の集計だけを成果物に残す
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-express
          path: |
            ${{ runner.temp }}/express-observations/results.json
            ${{ runner.temp }}/express-validation/results.json
      - name: 変える前と後の IFC4・IFC2X3 を書く
        run: ZUMEN_IFC_EDITED="$RUNNER_TEMP/edited" cargo test --locked -p zumen-ifc --all-features --test edit writes_the_edited_files_for_other_readers
      - name: IfcOpenShell で開き、変更が見え、検査の誤りが増えないことを確かめる
        run: python -I crates/zumen-ifc/tests/ifcopenshell/check.py "$RUNNER_TEMP/edited"
      - name: 公開サンプルの IFC を建物モデルに写し、要素の値を書く
        run: ZUMEN_IFC_SAMPLES_OUT="$RUNNER_TEMP/samples" cargo test --locked -p zumen-ifc --all-features --test samples writes_the_sample_models_for_other_readers
      - name: 同じ IFC を IfcOpenShell で読み、写した値が同じことを確かめる
        run: python -I crates/zumen-ifc/tests/ifcopenshell/samples.py samples "$RUNNER_TEMP/samples"
      - name: 合成の 3 バージョンと公開サンプルの曲線の値を書く
        run: ZUMEN_IFC_CURVES_OUT="$RUNNER_TEMP/curves" cargo test --locked -p zumen-ifc --all-features --test curves writes_curves_for_other_readers
      - name: 曲線の定義を IfcOpenShell で読んだ値と照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/curves.py "$RUNNER_TEMP/curves"
      - name: 要素の形状表現と共有写像の参照を書く
        run: ZUMEN_IFC_SHAPES_OUT="$RUNNER_TEMP/shapes" cargo test --locked -p zumen-ifc --all-features --test product_shapes writes_product_shapes_for_other_readers
      - name: 形状表現の参照と元の配置・写像の属性を IfcOpenShell と照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/product_shapes.py "$RUNNER_TEMP/shapes"
      - name: 形の葉から取得した押し出しと断面の値を書く
        run: ZUMEN_IFC_EXTRUSIONS_OUT="$RUNNER_TEMP/extrusions" cargo test --locked -p zumen-ifc --all-features --test extrusions writes_extrusions_for_other_readers
      - name: 未適用の押し出し・断面・外輪を IfcOpenShell の元属性と照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/extrusions.py "$RUNNER_TEMP/extrusions"
      - name: 代表要素から取得した矩形・円・任意断面の値を書く
        run: ZUMEN_IFC_PROFILES_OUT="$RUNNER_TEMP/profiles" cargo test --locked -p zumen-ifc --all-features --test profiles writes_profiles_for_other_readers
      - name: 断面の元寸法・配置と押し出しを IfcOpenShell の元属性と照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/profiles.py "$RUNNER_TEMP/profiles"
      - name: 形の葉に直接付いた面の表示の値を書く
        run: ZUMEN_IFC_STYLES_OUT="$RUNNER_TEMP/styles" cargo test --locked -p zumen-ifc --all-features --test styles writes_styles_for_other_readers
      - name: 面の色・透明度・反射の指定を IfcOpenShell の元属性と照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/styles.py "$RUNNER_TEMP/styles"
      - name: 通り芯から取得した軸と曲線の値を書く
        run: ZUMEN_IFC_GRIDS_OUT="$RUNNER_TEMP/grids" cargo test --locked -p zumen-ifc --all-features --test grids writes_grids_for_other_readers
      - name: 通り芯の所属・向きと曲線の元属性を IfcOpenShell と照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/grids.py "$RUNNER_TEMP/grids"
      - name: 合成 3 版と公開サンプルの SI 単位の元値を書く
        run: ZUMEN_IFC_UNITS_OUT="$RUNNER_TEMP/units" cargo test --locked -p zumen-ifc --all-features --test units writes_units_for_other_readers
      - name: SI 単位の種類・名前・接頭辞を IfcOpenShell の元属性と照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/units.py "$RUNNER_TEMP/units"
      - name: 変更だけで作った 2 階建てと、それを直した IFC と、新しい IFC のひな形と、変換した IFC を 3 版で書く（#898・#395）
        run: |
          ZUMEN_IFC_AUTHORED="$RUNNER_TEMP/authored" cargo test --locked -p zumen-ifc --all-features --test author -- writes_the_authored_files_for_other_readers writes_face_sets writes_booleans_and_mappings writes_revolutions_and_sweeps
          ZUMEN_IFC_AUTHORED="$RUNNER_TEMP/authored" cargo test --locked -p zumen-ifc --all-features --test create writes_the_templates_for_other_readers
          ZUMEN_IFC_AUTHORED="$RUNNER_TEMP/authored" cargo test --locked -p zumen-ifc --all-features --test convert writes_the_conversions_for_other_readers
      - name: ひな形と、作った IFC・直した IFC・変換した IFC を IfcOpenShell で検査し、単位・数・配置・所属・関係・層・開口を引いた体積を照らす
        run: python -I crates/zumen-ifc/tests/ifcopenshell/author.py "$RUNNER_TEMP/authored"
      - name: buildingSMART の ifc-gherkin-rules をコミットを決めて取り、別の環境に IfcOpenShell 0.8.5 と入れる
        # 規則は IfcOpenShell 0.8 の API で書かれている。MIT の照合ツールで、依存にも同梱にもしない
        run: |
          git init --quiet "$RUNNER_TEMP/gherkin"
          git -C "$RUNNER_TEMP/gherkin" fetch --quiet --depth 1 https://github.com/buildingSMART/ifc-gherkin-rules 893f8275049b8960c3ce0c7379b4b57aefeaa8f9
          git -C "$RUNNER_TEMP/gherkin" checkout --quiet FETCH_HEAD
          git -C "$RUNNER_TEMP/gherkin" submodule update --init --depth 1 --quiet
          python -m venv "$RUNNER_TEMP/gherkin-venv"
          "$RUNNER_TEMP/gherkin-venv/bin/python" -m pip install --quiet -r "$RUNNER_TEMP/gherkin/requirements.txt" -r "$RUNNER_TEMP/gherkin/ifc_validation_models/requirements.txt" ifcopenshell==0.8.5
      - name: ひな形と、作った IFC と直した IFC を ifc-gherkin-rules の規則にかけ、誤りがないことを確かめる
        run: '"$RUNNER_TEMP/gherkin-venv/bin/python" -I crates/zumen-ifc/tests/ifcopenshell/gherkin.py "$RUNNER_TEMP/gherkin" "$RUNNER_TEMP/authored"'

  ids:
    name: IDS の名前の要件を IfcTester と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: 判定に必要な外部ツールだけを固定した wheel で入れる
        run: |
          python -m pip install --only-binary :all: --no-deps -r xtask/verify/ids/requirements.txt
      - name: 公開操作を呼ぶ CLI をビルドする
        run: cargo build --locked -p zumen-cli --bin zumen
      - name: 公開 IFC と自作 IDS の 3 文字コードを照らす
        run: python -I xtask/verify/ids/check.py --cli target/debug/zumen --out "$RUNNER_TEMP/ids-check"
      - name: 値の改変・欠落・重複と出力先の拒否を確かめる
        run: python -I xtask/verify/ids/test_check.py "$RUNNER_TEMP/ids-check"
      - name: 公開入力だけの照合キットを保存する
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-ids
          path: ${{ runner.temp }}/ids-check
          retention-days: 30

  bcf:
    name: BCF の読み書きを Smino.Bcf.Toolkit と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
