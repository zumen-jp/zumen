name: 毎晩

on:
  schedule:
    # 毎日 3:00（日本時間）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  browser:
    name: ブラウザーで適合試験（${{ matrix.browser }}）
    # PR ごとの Chromium は ci.yml の wasm の job で流す。毎晩は Firefox と WebKit（docs/support.md、決定 0199）
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: 分けた wasm のモジュールを作る（決定 0221）
        run: |
          mkdir -p modules
          for module in drawing bim; do
            cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked --no-default-features --features $module
            cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_$module.wasm
          done
      - name: ブラウザーに配るのと同じ形で作る（決定 0007）
        run: cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked
      - name: ブラウザーを動かす道具（Playwright）を、インストールのスクリプトを走らせずに入れる（決定 0199）
        working-directory: bindings/js/test/browser
        run: npm ci --ignore-scripts
      - name: Playwright の版に合うブラウザーと、それが使う OS のライブラリを入れる
        working-directory: bindings/js/test/browser
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: ブラウザーの中で包みを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0199）
        run: node bindings/js/test/browser/run.mjs ${{ matrix.browser }} target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_drawing.wasm modules/zumen_abi1_bim.wasm

  go:
    name: Go の包みで適合試験（Go ${{ matrix.go }}）
    # 階層 2 の Go は毎晩、サポート中の 2 つの大版で流す（docs/support.md、決定 0226）
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust と、wasm32 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Go を入れる
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: bindings/go/go.sum
      - name: すべての形式を入れた wasm のモジュールを作り、包みに写す（決定 0221）
        run: |
          cargo build --release --locked --target wasm32-unknown-unknown -p zumen-abi
          cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm bindings/go/
      - name: Go の包みを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0226）
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -v ./...
  dart:
    name: Dart の包みで適合試験（${{ matrix.name }}）
    # 階層 2 の Dart は毎晩流す。下限の Dart 3.0 と、今の安定版で流す（docs/support.md、決定 0227）
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dart 3.0、Linux x64
            os: ubuntu-latest
            sdk: 3.0.0
            library: libzumen_abi1.so
          - name: 安定版、Linux x64
            os: ubuntu-latest
            sdk: stable
            library: libzumen_abi1.so
          - name: 安定版、macOS arm64
            os: macos-latest
            sdk: stable
            library: libzumen_abi1.dylib
          - name: 安定版、Windows x64
            os: windows-latest
            sdk: stable
            library: zumen_abi1.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - name: Dart を入れる
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Dart の包みを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0227）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked
          cd bindings/dart
          dart pub get
          dart analyze --fatal-infos
          dart run tool/conformance.dart "$GITHUB_WORKSPACE/target/debug/${{ matrix.library }}" "$GITHUB_WORKSPACE"

  java:
    name: Java の包みで適合試験（${{ matrix.name }}）
    # 階層 2 の Java は毎晩流す。下限の Java 8 で作り、流す（docs/support.md、決定 0224）
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            library: libzumen_abi1.so
            separator: ':'
          - name: macOS arm64
            os: macos-latest
            library: libzumen_abi1.dylib
            separator: ':'
          - name: Windows x64
            os: windows-latest
            library: zumen_abi1.dll
            separator: ';'
          # 32 bit の Windows では、関数を stdcall で呼ぶ（決定 0011）
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            java-architecture: x86
            library: zumen_abi1.dll
            separator: ';'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust を入れる
        run: rustup toolchain install
      - name: 試験する target を入れる
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - name: Java 8 を入れる
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '8'
          architecture: ${{ matrix.java-architecture || '' }}
      - name: JNA を Maven Central から取り、SHA-256 を確かめる
        shell: bash
        run: sh bindings/java/fetch-jna.sh target/jna
      - name: Java の包みを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0224）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          mkdir -p target/java
          javac -encoding UTF-8 -cp target/jna/jna.jar -d target/java bindings/java/src/main/java/dev/zumen/*.java bindings/java/src/test/java/dev/zumen/*.java
          java -cp "target/java${{ matrix.separator }}target/jna/jna.jar" dev.zumen.Conformance "target/${{ matrix.target && format('{0}/', matrix.target) || '' }}debug/${{ matrix.library }}"

  android:
    name: Java の包みで適合試験（Android のエミュレーター、API 24）
    # Kotlin（Android）は、Java の包みを使う。下限の Android 7.0（API 24）で流す（docs/support.md、決定 0224）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust と、エミュレーターの target を入れる
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android
      - name: エミュレーターが KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ネイティブのライブラリを、NDK で API 24 に向けて作る
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android24-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          cargo build --package zumen-abi --locked --release --target x86_64-linux-android
      - name: JNA を Maven Central から取り、SHA-256 を確かめる
        run: sh bindings/java/fetch-jna.sh target/jna
      - name: 包みと試験を Java 8 のクラスにし、d8 で JNA の aar のクラスと一緒に dex にする
        run: |
          mkdir -p target/android target/java
          javac --release 8 -encoding UTF-8 -cp target/jna/jna.jar -d target/java bindings/java/src/main/java/dev/zumen/*.java bindings/java/src/test/java/dev/zumen/*.java
          (cd target/java && jar cf ../zumen.jar dev)
          unzip -p target/jna/jna.aar classes.jar > target/jna/jna-android.jar
          unzip -p target/jna/jna.aar jni/x86_64/libjnidispatch.so > target/android/libjnidispatch.so
          cp target/x86_64-linux-android/release/libzumen_abi1.so target/android/
          d8="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)d8"
          "$d8" --release --min-api 24 --output target/android/classes.zip target/zumen.jar target/jna/jna-android.jar
      - name: エミュレーターの中で包みを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0224）
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: sh bindings/java/android/run.sh target/android
  swift:
    name: Swift の包みで適合試験（macOS と iOS のシミュレーター）
    # 決定 0225。下限は iOS 15・macOS 12（docs/support.md）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml の版の Rust と、Apple の対象を入れる
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: 配るのと同じ対象で、XCFramework を作る
        run: sh bindings/swift/build-xcframework.sh debug
      - name: macOS で、SwiftPM で作った包みを通しても、ネイティブと同じハッシュの一覧になることを確かめる
        working-directory: bindings/swift
        run: swift run ZumenConformance "$GITHUB_WORKSPACE"
      - name: iOS のシミュレーターで、同じことを確かめる
        run: sh bindings/swift/test-simulator.sh
