name: 毎晩

on:
  schedule:
    # 毎日 3:00（日本時間）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  browser:
    name: ブラウザーで適合テスト（${{ matrix.browser }}）
    # PR ごとの Chromium は ci.yml の wasm の job で流す。毎晩は Firefox と WebKit（docs/support.md、決定 0199）
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: 分けた wasm のモジュールを作る（決定 0221）
        run: |
          mkdir -p modules
          for module in drawing bim civil pointcloud plugin; do
            cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked --no-default-features --features $module
            cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_$module.wasm
          done
      - name: ブラウザーに配るのと同じ形で作る（決定 0007）
        run: cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked
      - name: ブラウザーを動かすツール（Playwright）を、インストールのスクリプトを走らせずに入れる（決定 0199）
        working-directory: bindings/js/test/browser
        run: npm ci --ignore-scripts
      - name: Playwright のバージョンに合うブラウザーと、それが使う OS のライブラリを入れる
        working-directory: bindings/js/test/browser
        run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: ブラウザーの中でラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0199）
        run: node bindings/js/test/browser/run.mjs ${{ matrix.browser }} target/wasm32-unknown-unknown/release/zumen_abi1.wasm modules/zumen_abi1_drawing.wasm modules/zumen_abi1_bim.wasm modules/zumen_abi1_civil.wasm modules/zumen_abi1_pointcloud.wasm modules/zumen_abi1_plugin.wasm
      - name: Canvas 2D で合成シーンと DXF・JWW・SXF を描く（決定 0267）
        env:
          ZUMEN_PDFJS_REQUIRED: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix xtask/verify/pdfjs
          node bindings/js/test/browser/view2d.mjs ${{ matrix.browser }} target/wasm32-unknown-unknown/release/zumen_abi1.wasm
      - name: React のフックとプレイグラウンドをブラウザーで確かめる
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix playground
          node bindings/js/test/browser/react.mjs ${{ matrix.browser }} modules/zumen_abi1_drawing.wasm

  svg:
    name: SVG・PNG を Chromium で開いて照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 既存の Playwright を、インストールのスクリプトを走らせずに入れる
        working-directory: bindings/js/test/browser
        run: npm ci --ignore-scripts
      - name: Playwright のバージョンに合う Chromium と OS のライブラリを入れる
        working-directory: bindings/js/test/browser
        run: npx --no-install playwright install --with-deps --only-shell chromium
      - name: シーンから SVG・PNG の照合用のファイルを作る（決定 0272・0277）
        run: cargo run --locked -p zumen-render --example export -- target/svg-check
      - name: SVG・PNG の描画順・穴・字形・切り抜きを外部の実装と照らす（決定 0254）
        run: node crates/zumen-render/tests/browser.mjs target/svg-check/drawing.svg target/svg-check/region.svg

  nextjs:
    name: Next.js のサーバー側でパッケージを使う
    # npm pack したパッケージを、Turbopack（設定なし）と webpack（serverExternalPackages）で standalone に組み、API ルートで
    # 図面を開く（決定 0259）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: npm で配るのと同じ形で作る（決定 0205）
        run: cargo build --package zumen-abi --target wasm32-unknown-unknown --release --locked
      - name: Next.js と React を、インストールのスクリプトを走らせずに入れる
        working-directory: bindings/js/test/nextjs
        run: npm ci --ignore-scripts
      - name: Turbopack と webpack で組み、組んだサーバーの API ルートで公開サンプルの DXF を開く
        run: node bindings/js/test/nextjs/run.mjs target/wasm32-unknown-unknown/release/zumen_abi1.wasm

  cli:
    name: CLI・HTTP・WASI で適合テスト
    # Tier 3 の言語が使う形態を、言語に依らないテストのツール（bindings/conformance/cli.mjs）で流す（決定 0006・0013・0200、#403）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、wasm32-wasip1 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: CLI を、ネイティブと WASI の 2 つで作る
        run: |
          cargo build --release --locked -p zumen-cli
          cargo build --release --locked -p zumen-cli --target wasm32-wasip1
      - name: zumen call・serve --stdio・serve --http で流し、hashes.txt と一致することを確かめる
        run: |
          for mode in call stdio http; do
            node bindings/conformance/cli.mjs $mode target/release/zumen
          done
      - name: WASI のランタイム（node:wasi）の上の serve --stdio で流し、hashes.txt と一致することを確かめる
        run: node bindings/conformance/cli.mjs wasi target/wasm32-wasip1/release/zumen.wasm

  ifcopenshell:
    name: IFC を IfcOpenShell で開いて照らす
    # 書いたファイルと、公開サンプルの建物モデルへの写し方を、zumen でない IFC を読むソフトで確かめる
    # （決定 0244、#482・#412）。IfcOpenShell はテストのツールで、依存にしない
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: IfcOpenShell と、EXPRESS の規則の検査が使う pytest を、バージョンを決めて入れる
        run: python -m pip install ifcopenshell==0.9.0.post1 pytest==9.2.0
      - name: 変える前と後の IFC4・IFC2X3 を書く
        run: ZUMEN_IFC_EDITED="$RUNNER_TEMP/edited" cargo test --locked -p zumen-ifc --all-features --test edit writes_the_edited_files_for_other_readers
      - name: IfcOpenShell で開き、変更が見え、検査の誤りが増えないことを確かめる
        run: python -I crates/zumen-ifc/tests/ifcopenshell/check.py "$RUNNER_TEMP/edited"
      - name: 公開サンプルの IFC を建物モデルに写し、要素の値を書く
        run: ZUMEN_IFC_SAMPLES_OUT="$RUNNER_TEMP/samples" cargo test --locked -p zumen-ifc --all-features --test samples writes_the_sample_models_for_other_readers
      - name: 同じ IFC を IfcOpenShell で読み、写した値が同じことを確かめる
        run: python -I crates/zumen-ifc/tests/ifcopenshell/samples.py samples "$RUNNER_TEMP/samples"

  laspy:
    name: 非圧縮 LAS の読みを laspy と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: laspy と NumPy をテストのツールとして入れる
        run: |
          python -m pip install --only-binary :all: laspy==2.7.0 numpy==2.5.4
      - name: 既知値の全点形式と公開サンプルのヘッダー・全点を照らす
        env:
          ZUMEN_LASPY_REQUIRED: '1'
        run: cargo test --locked -p zumen-las --test external

  pdf:
    name: PDF の読みを pdf.js と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: pdf.js をテストのツールとして入れる
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix xtask/verify/pdfjs
      - name: 合成の PDF と公開サンプルを照らす
        env:
          ZUMEN_PDFJS_REQUIRED: '1'
        run: cargo test --locked -p zumen-pdf --test external

  external:
    name: 書き戻し・変換した図面を外部の実装と照らし、検証キットを作る
    # 図面の形式を zumen でない実装で読んで照らし、AutoCAD・Jw_cad・SXF ブラウザで開く検証キットを成果物に置く（決定 0254、#503）。
    # ezdxf・ACadSharp・ezjww・ezsxf はテストのツールで、依存にしない（xtask/verify/README.md）
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 照らす外部の実装を、バージョンを決めて入れる
        # wheel だけを入れる。wheel がなければ、ソースから作らずに止める（この job には Rust がある）
        run: |
          python -m pip install --only-binary :all: ezdxf==1.4.5 ezjww==0.7.6 ezsxf==0.3.7
      - name: ACadSharp で DWG を読むツールに使う .NET の SDK を入れる
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: CLI を作る
        run: cargo build --release --locked -p zumen-cli
      - name: 公開サンプルと適合テストの図面に書き戻しと変換を当て、検証キットを作る
        id: make
        run: python -I xtask/verify/make.py target/release/zumen "$RUNNER_TEMP/verify"
      - name: AutoCAD の書式を実機で確認する合成入力と比較手順をキットに加える
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: |
          python -I -m unittest discover -s xtask/autocad/check316 -p 'test_*.py'
          python -I xtask/autocad/check316/make.py "$RUNNER_TEMP/verify/316/controls"
      - name: 検証キットの DXF を ezdxf で読み、zumen の読みと照らす
        # 当たらなかった変更があっても、書いたファイルは照らす。CLI を作れずキットがないときは流さない
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: |
          python -I xtask/verify/check_ezdxf.py "$RUNNER_TEMP/verify"
          python -I xtask/verify/test_dxf_layer_fields.py target/release/zumen
      - name: 検証キットの JWW を ezjww で読み、zumen の読みと照らす
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: python -I xtask/verify/check_ezjww.py "$RUNNER_TEMP/verify"
      - name: 検証キットの SFC・P21 を ezsxf で読み、zumen の読みと照らす
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: |
          python -I xtask/verify/check_ezsxf.py "$RUNNER_TEMP/verify"
          python -I xtask/verify/test_ezsxf.py "$RUNNER_TEMP/verify"
      - name: 検証キットの DWG を ACadSharp で読み、値を書き出す
        id: acadsharp
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: dotnet run --project xtask/verify/acadsharp -c Release -- "$RUNNER_TEMP/verify"
      - name: ACadSharp で読んだ値を、zumen の読みと照らす
        if: ${{ !cancelled() && steps.acadsharp.outcome == 'success' }}
        run: python -I xtask/verify/check_acadsharp.py "$RUNNER_TEMP/verify"
      - name: 照合が、形を返さない要素の種類の取り違えと、描かない JWW の文字を食い違いにすることを確かめる
        # DXF・JWW は ACadSharp の段の成否によらず流す。DWG は acadsharp-dump.json があるときだけ確かめる
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: python -I xtask/verify/test_source_kinds.py "$RUNNER_TEMP/verify"
      - name: 検証キットを成果物に置く
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-bundle
          path: ${{ runner.temp }}/verify
          retention-days: 30
          if-no-files-found: error

  tier3:
    name: Tier 3 の言語のサンプル
    # docs/tier3.md の 4 つの形のサンプルを、ランナーに入っている Ruby・PHP・PowerShell で流す（決定 0006・0013、#404）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、wasm32-wasip1 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-wasip1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # docs/support.md の Node.js の下限
          node-version: 22
      - name: C ABI のライブラリと、ネイティブと WASI の CLI を作る
        run: |
          cargo build --release --locked -p zumen-abi -p zumen-cli
          cargo build --release --locked -p zumen-cli --target wasm32-wasip1
      - name: 4 つの形のサンプルを流し、書いたものが expected.txt と同じことを確かめる
        run: |
          drawing=samples/dwg/zumen-layout-r2000_ascii.dxf
          expected=examples/tier3/expected.txt
          ruby examples/tier3/ruby/c_abi.rb target/release/libzumen_abi1.so $drawing | diff $expected -
          php examples/tier3/php/stdio.php $drawing target/release/zumen serve --stdio | diff $expected -
          php examples/tier3/php/stdio.php $drawing node bindings/conformance/wasi.mjs target/wasm32-wasip1/release/zumen.wasm serve --stdio | diff $expected -
          pwsh examples/tier3/powershell/http.ps1 -Zumen target/release/zumen -Drawing $drawing | diff $expected -

  go:
    name: Go のラッパーで適合テスト（Go ${{ matrix.go }}）
    # Tier 2 の Go は毎晩、サポート中の 2 つのメジャーバージョンで流す（docs/support.md、決定 0226）
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、wasm32 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Go を入れる
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: bindings/go/go.sum
      - name: すべての形式を入れた wasm のモジュールを作り、ラッパーに写す（決定 0221）
        run: |
          cargo build --release --locked --target wasm32-unknown-unknown -p zumen-abi
          cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm bindings/go/
      - name: Go のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0226）
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -v ./...
  dart:
    name: Dart のラッパーで適合テスト（${{ matrix.name }}）
    # Tier 2 の Dart は毎晩流す。下限の Dart 3.0 と、今の安定版で流す（docs/support.md、決定 0227）
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dart 3.0、Linux x64
            os: ubuntu-latest
            sdk: 3.0.0
            library: libzumen_abi1.so
          - name: 安定版、Linux x64
            os: ubuntu-latest
            sdk: stable
            library: libzumen_abi1.so
          - name: 安定版、macOS arm64
            os: macos-latest
            sdk: stable
            library: libzumen_abi1.dylib
          - name: 安定版、Windows x64
            os: windows-latest
            sdk: stable
            library: zumen_abi1.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - name: Dart を入れる
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Dart のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0227）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked
          cd bindings/dart
          dart pub get
          dart analyze --fatal-infos
          dart run tool/test_collections.dart
          dart run tool/test_async.dart "$GITHUB_WORKSPACE/target/debug/${{ matrix.library }}"
          dart run tool/conformance.dart "$GITHUB_WORKSPACE/target/debug/${{ matrix.library }}" "$GITHUB_WORKSPACE"

  java:
    name: Java のラッパーで適合テスト（${{ matrix.name }}）
    # Tier 2 の Java は毎晩流す。下限の Java 8 で作り、流す（docs/support.md、決定 0224）
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            library: libzumen_abi1.so
            separator: ':'
          - name: macOS arm64
            os: macos-latest
            library: libzumen_abi1.dylib
            separator: ':'
          - name: Windows x64
            os: windows-latest
            library: zumen_abi1.dll
            separator: ';'
          # 32 bit の Windows では、関数を stdcall で呼ぶ（決定 0011）
          - name: Windows x86
            os: windows-latest
            target: i686-pc-windows-msvc
            java-architecture: x86
            library: zumen_abi1.dll
            separator: ';'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - name: テストする target を入れる
        if: matrix.target
        run: rustup target add ${{ matrix.target }}
      - name: Java 8 を入れる
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '8'
          architecture: ${{ matrix.java-architecture || '' }}
      - name: JNA を Maven Central から取り、SHA-256 を確かめる
        shell: bash
        run: sh bindings/java/fetch-jna.sh target/jna
      - name: Java のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0224）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
          mkdir -p target/java
          javac -encoding UTF-8 -cp target/jna/jna.jar -d target/java bindings/java/src/main/java/dev/zumen/*.java bindings/java/src/test/java/dev/zumen/*.java
          java -cp "target/java${{ matrix.separator }}target/jna/jna.jar" dev.zumen.Conformance "target/${{ matrix.target && format('{0}/', matrix.target) || '' }}debug/${{ matrix.library }}"

  android:
    name: Java のラッパーで適合テスト（Android のエミュレーター、API 24）
    # Kotlin（Android）は、Java のラッパーを使う。下限の Android 7.0（API 24）で流す（docs/support.md、決定 0224）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、エミュレーターの target を入れる
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android
      - name: エミュレーターが KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ネイティブのライブラリを、NDK で API 24 に向けて作る
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android24-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android24-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          cargo build --package zumen-abi --locked --release --target x86_64-linux-android
      - name: JNA を Maven Central から取り、SHA-256 を確かめる
        run: sh bindings/java/fetch-jna.sh target/jna
      - name: ラッパーとテストを Java 8 のクラスにし、d8 で JNA の aar のクラスと一緒に dex にする
        run: |
          mkdir -p target/android target/java
          javac --release 8 -encoding UTF-8 -cp target/jna/jna.jar -d target/java bindings/java/src/main/java/dev/zumen/*.java bindings/java/src/test/java/dev/zumen/*.java
          (cd target/java && jar cf ../zumen.jar dev)
          unzip -p target/jna/jna.aar classes.jar > target/jna/jna-android.jar
          unzip -p target/jna/jna.aar jni/x86_64/libjnidispatch.so > target/android/libjnidispatch.so
          cp target/x86_64-linux-android/release/libzumen_abi1.so target/android/
          d8="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)d8"
          "$d8" --release --min-api 24 --output target/android/classes.zip target/zumen.jar target/jna/jna-android.jar
      - name: エミュレーターの中でラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0224）
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 24
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: sh bindings/java/android/run.sh target/android
  swift:
    name: Swift のラッパーで適合テスト（macOS と iOS のシミュレーター）
    # 決定 0225。下限は iOS 15・macOS 12（docs/support.md）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、Apple の対象を入れる
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: 配るのと同じ対象で、XCFramework を作る
        run: sh bindings/swift/build-xcframework.sh debug
      - name: macOS で、SwiftPM で作ったラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる
        working-directory: bindings/swift
        run: swift run ZumenConformance "$GITHUB_WORKSPACE"
      - name: iOS のシミュレーターで、同じことを確かめる
        run: sh bindings/swift/test-simulator.sh
