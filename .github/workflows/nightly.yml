        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: 外部ツールの固定した DLL と自作の呼び出し部分を用意する
        run: python -I xtask/verify/bcf/prepare.py --out "$RUNNER_TEMP/bcf-tools"
      - name: 公開操作を呼ぶ CLI をビルドする
        run: cargo build --locked -p zumen-cli --bin zumen
      - name: 自作 BCF の編集・新規出力と外部実装の再保存を照らす
        run: python -I xtask/verify/bcf/check.py --cli target/debug/zumen --tools "$RUNNER_TEMP/bcf-tools" --out "$RUNNER_TEMP/bcf-check"
      - name: 値と参照の改変・欠落・重複と出力先の拒否を確かめる
        run: python -I xtask/verify/bcf/test_check.py "$RUNNER_TEMP/bcf-check"
      - name: 外部 DLL を含まない照合キットを保存する
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-bcf
          path: ${{ runner.temp }}/bcf-check
          retention-days: 30

  stbridge:
    name: ST-Bridge の公開サンプルを STBDotNet と照らす
    # STBDotNet（MIT）はテストのツールで、依存にしない（xtask/verify/stbridge/README.md、#400）
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: 公開操作を呼ぶ CLI をビルドする
        run: cargo build --locked -p zumen-cli --bin zumen
      - name: 照合が値・参照・配置の食い違いを見逃さないことを確かめる
        run: python -I -m unittest discover -s xtask/verify/stbridge -p test_check.py
      - name: 公開サンプルを STBDotNet と zumen で読んで照らす
        run: python -I xtask/verify/stbridge/check.py --cli target/debug/zumen --out "$RUNNER_TEMP/stbridge-check"
      - name: 照合の結果を保存する
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-stbridge
          path: ${{ runner.temp }}/stbridge-check
          retention-days: 30

  pye57:
    name: 公開E57の全点と色をpye57と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.tomlのバージョンのRustを入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: pye57と依存をテスト用のwheelで入れる
        run: |
          python -m pip install --only-binary :all: pye57==0.4.19 numpy==2.5.4 pyquaternion==0.9.9
      - name: 公開の倍精度・単精度の全点・色・範囲と診断を照らす
        env:
          ZUMEN_PYE57_REQUIRED: '1'
        run: cargo test --locked -p zumen-e57 --test external
      - name: 公開APIの全点と比較器の改変検査を流し、キットを作る
        run: |
          cargo build --locked -p zumen-cli
          python -I xtask/verify/e57/check_api.py --cli target/debug/zumen --out "$RUNNER_TEMP/e57-check"
          python -I xtask/verify/e57/test_check.py "$RUNNER_TEMP/e57-check"
      - name: 公開サンプルと期待値・観測値を成果物に残す
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-e57
          path: ${{ runner.temp }}/e57-check
          retention-days: 30

  laspy:
    name: LAS と LAZ の読みを laspy と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: laspy・lazrs・NumPy をテストのツールとして入れる
        run: |
          python -m pip install --only-binary :all: laspy==2.7.0 lazrs==0.9.0 numpy==2.5.4
      - name: 既知値の全点形式と公開サンプル（LAS・LAZ）のヘッダー・全点を照らす
        env:
          ZUMEN_LASPY_REQUIRED: '1'
        run: cargo test --locked -p zumen-las --test external
      - name: 公開 XYZ を同じ点群の LAS と照らす
        run: |
          cargo build --locked -p zumen-cli
          python -I xtask/verify/laspy/check_xyz.py target/debug/zumen

  photo:
    name: 工事写真の Exif と XMP の読みを Pillow と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Pillow をテストのツールとして入れる
        run: |
          python -m pip install --only-binary :all: pillow==13.0.0
      - name: 公開サンプルと合成の JPEG の Exif・GPS・XMP を照らす
        env:
          ZUMEN_PHOTO_REQUIRED: '1'
        run: cargo test --locked -p zumen-photo --test external

  shapely:
    name: GeoJSON の読み書きを Shapely と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Shapely と NumPy をテストのツールとして入れる
        run: |
          python -m pip install --only-binary :all: shapely==2.2.0 numpy==2.5.4
      - name: WGS 84・平面直角逆投影・3D 立体の書き出しと 7 種の幾何の読みを照らす
        env:
          ZUMEN_SHAPELY_REQUIRED: '1'
        run: cargo test --locked -p zumen-geojson --test external

  tiff:
    name: TIFF・GeoTIFF の読みと PNG 復号を Pillow・tifffile と照らす
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Pillow・tifffile・NumPy をテストのツールとして入れる
        run: |
          python -m pip install --only-binary :all: pillow==13.0.0 tifffile==2026.11.12 numpy==2.5.4
      - name: 各種圧縮・タイル・面分離・マルチページの PNG 画素と GeoTIFF 外周・DEM 点群を照らす
        env:
          ZUMEN_TIFF_REQUIRED: '1'
        run: cargo test --locked -p zumen-tiff --test external

  external:
    name: 書き戻し・変換した図面を外部の実装と照らし、検証キットを作る
    # 図面の形式を zumen でない実装で読んで照らし、AutoCAD・Jw_cad・SXF ブラウザで開く検証キットを成果物に置く（決定 0254、#503）。
    # ezdxf・ACadSharp・ezjww・ezsxf はテストのツールで、依存にしない（xtask/verify/README.md）
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: 照らす外部の実装を、バージョンを決めて入れる
        # wheel だけを入れる。wheel がなければ、ソースから作らずに止める（この job には Rust がある）
        run: |
          python -m pip install --only-binary :all: ezdxf==1.4.5 ezjww==0.7.6 ezsxf==0.3.7
      - name: ACadSharp で DWG を読むツールに使う .NET の SDK を入れる
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: CLI を作る
        run: cargo build --release --locked -p zumen-cli
      - name: 公開サンプルと適合テストの図面に書き戻しと変換を当て、検証キットを作る
        id: make
        run: python -I xtask/verify/make.py target/release/zumen "$RUNNER_TEMP/verify"
      - name: AutoCAD の書式を実機で確認する合成入力と比較手順をキットに加える
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: |
          python -I -m unittest discover -s xtask/autocad/check316 -p 'test_*.py'
          python -I xtask/autocad/check316/make.py "$RUNNER_TEMP/verify/316/controls"
      - name: 検証キットの DXF を ezdxf で読み、zumen の読みと照らす
        # 当たらなかった変更があっても、書いたファイルは照らす。CLI を作れずキットがないときは流さない
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: |
          python -I xtask/verify/check_ezdxf.py "$RUNNER_TEMP/verify"
          python -I xtask/verify/test_dxf_layer_fields.py target/release/zumen
      - name: Rust と API の共用 lower から合成 DXF を作る
        env:
          ZUMEN_DXF_LOWER_OUT: ${{ runner.temp }}/dxf-lower
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: cargo test --locked -p zumen-abi --lib convert::tests::the_api_writes_what_the_rust_lower_writes -- --exact
      - name: Rust と API の DXF の要素・表・用紙を ezdxf と照らす
        run: python -I xtask/verify/test_dxf_lower.py "$RUNNER_TEMP/dxf-lower"
      - name: 検証キットの JWW を ezjww で読み、zumen の読みと照らす
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: python -I xtask/verify/check_ezjww.py "$RUNNER_TEMP/verify"
      - name: 検証キットの SFC・P21 を ezsxf で読み、zumen の読みと照らす
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: |
          python -I xtask/verify/check_ezsxf.py "$RUNNER_TEMP/verify"
          python -I xtask/verify/test_ezsxf.py "$RUNNER_TEMP/verify"
      - name: JWW・SFC・P21の点追加を照らし、実機用の期待値と部分照合の記録を作る
        run: |
          python -I xtask/verify/points/make.py target/release/zumen "$RUNNER_TEMP/verify/342/points-kit"
          python -I xtask/verify/points/test_make.py "$RUNNER_TEMP/verify/342/points-kit"
      - name: 検証キットの DWG を ACadSharp で読み、値を書き出す
        id: acadsharp
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: dotnet run --project xtask/verify/acadsharp -c Release -- "$RUNNER_TEMP/verify"
      - name: ACadSharp で読んだ値を、zumen の読みと照らす
        if: ${{ !cancelled() && steps.acadsharp.outcome == 'success' }}
        run: python -I xtask/verify/check_acadsharp.py "$RUNNER_TEMP/verify"
      - name: 照合が、形を返さない要素の種類の取り違えと、描かない JWW の文字を食い違いにすることを確かめる
        # DXF・JWW は ACadSharp の段の成否によらず流す。DWG は acadsharp-dump.json があるときだけ確かめる
        if: ${{ !cancelled() && steps.make.outcome != 'skipped' }}
        run: python -I xtask/verify/test_source_kinds.py "$RUNNER_TEMP/verify"
      - name: AutoCAD の照合のスクリプトの、出力の読みと値の比べ方を合成の入力で確かめる
        # AutoCAD は CI にないので、照合そのものは AutoCAD のある端末の手元で流す（xtask/verify/README.md、#683）
        if: ${{ !cancelled() }}
        run: python -I -m unittest discover -s xtask/verify -p 'test_check_autocad.py'
      - name: 検証キットを成果物に置く
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-bundle
          path: ${{ runner.temp }}/verify
          retention-days: 30
          if-no-files-found: error

  go:
    name: Go のラッパーで適合テスト（Go ${{ matrix.go }}）
    # Tier 2 の Go は毎晩、サポート中の 2 つのメジャーバージョンで流す（docs/support.md、決定 0226）
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、wasm32 の target を入れる
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - name: Go を入れる
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: bindings/go/go.sum
      - name: すべての形式を入れた wasm のモジュールを作り、ラッパーに写す（決定 0221）
        run: |
          cargo build --release --locked --target wasm32-unknown-unknown -p zumen-abi
          cp target/wasm32-unknown-unknown/release/zumen_abi1.wasm bindings/go/
      - name: Go のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0226）
        working-directory: bindings/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -v ./...
  dart:
    name: Dart のラッパーで適合テスト（${{ matrix.name }}）
    # Tier 2 の Dart は毎晩流す。下限の Dart 3.5 と、今の安定版で流す（docs/support.md、決定 0227）
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Dart 3.5、Linux x64
            os: ubuntu-latest
            sdk: 3.5.0
            library: libzumen_abi1.so
          - name: 安定版、Linux x64
            os: ubuntu-latest
            sdk: stable
            library: libzumen_abi1.so
          - name: 安定版、macOS arm64
            os: macos-latest
            sdk: stable
            library: libzumen_abi1.dylib
          - name: 安定版、Windows x64
            os: windows-latest
            sdk: stable
            library: zumen_abi1.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - name: Dart を入れる
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: ${{ matrix.sdk }}
      - name: Dart のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0227）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked
          cd bindings/dart
          dart pub get
          dart analyze --fatal-infos
          dart run tool/test_collections.dart
          dart run tool/test_async.dart "$GITHUB_WORKSPACE/target/debug/${{ matrix.library }}"
          dart run tool/conformance.dart "$GITHUB_WORKSPACE/target/debug/${{ matrix.library }}" "$GITHUB_WORKSPACE"

  java:
    name: Java のラッパーで適合テスト（${{ matrix.name }}）
    # Tier 2 の Java は毎晩流す。下限の Java 21 で作り、流す（docs/support.md、決定 0224）
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            library: libzumen_abi1.so
            separator: ':'
          - name: macOS arm64
            os: macos-latest
            library: libzumen_abi1.dylib
            separator: ':'
          - name: Windows x64
            os: windows-latest
            library: zumen_abi1.dll
            separator: ';'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust を入れる
        run: rustup toolchain install
      - name: Java 21 を入れる
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: JNA を Maven Central から取り、SHA-256 を確かめる
        shell: bash
        run: sh bindings/java/fetch-jna.sh target/jna
      - name: Java のラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0224）
        shell: bash
        run: |
          cargo build --package zumen-abi --locked
          mkdir -p target/java
          javac --release 21 -encoding UTF-8 -cp target/jna/jna.jar -d target/java bindings/java/src/main/java/dev/zumen/*.java bindings/java/src/test/java/dev/zumen/*.java
          java -cp "target/java${{ matrix.separator }}target/jna/jna.jar" dev.zumen.Conformance "target/debug/${{ matrix.library }}"

  android:
    name: Java のラッパーで適合テスト（Android のエミュレーター、API 31）
    # Kotlin（Android）は、Java のラッパーを使う。下限の Android 12（API 31）で流す（docs/support.md、決定 0224）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、エミュレーターの target を入れる
        run: |
          rustup toolchain install
          rustup target add x86_64-linux-android
      - name: Java 21 を入れる
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '21'
      - name: エミュレーターが KVM を使えるようにする
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: ネイティブのライブラリを、NDK で API 31 に向けて作る
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$bin/x86_64-linux-android31-clang"
          export CC_x86_64_linux_android="$bin/x86_64-linux-android31-clang"
          export AR_x86_64_linux_android="$bin/llvm-ar"
          cargo build --package zumen-abi --locked --release --target x86_64-linux-android
      - name: JNA を Maven Central から取り、SHA-256 を確かめる
        run: sh bindings/java/fetch-jna.sh target/jna
      - name: ラッパーとテストをクラスにし、d8 で JNA の aar のクラスと一緒に dex にする
        run: |
          mkdir -p target/android target/java
          javac --release 17 -encoding UTF-8 -cp target/jna/jna.jar -d target/java bindings/java/src/main/java/dev/zumen/*.java bindings/java/src/test/java/dev/zumen/*.java
          (cd target/java && jar cf ../zumen.jar dev)
          unzip -p target/jna/jna.aar classes.jar > target/jna/jna-android.jar
          unzip -p target/jna/jna.aar jni/x86_64/libjnidispatch.so > target/android/libjnidispatch.so
          cp target/x86_64-linux-android/release/libzumen_abi1.so target/android/
          d8="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)d8"
          "$d8" --release --min-api 31 --output target/android/classes.zip target/zumen.jar target/jna/jna-android.jar
      - name: エミュレーターの中でラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる（決定 0224）
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          script: sh bindings/java/android/run.sh target/android
  swift:
    name: Swift のラッパーで適合テスト（macOS と iOS のシミュレーター）
    # 決定 0225。下限は iOS 17・macOS 14（docs/support.md）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: rust-toolchain.toml のバージョンの Rust と、Apple の対象を入れる
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - name: 配るのと同じ対象で、XCFramework を作る
        run: sh bindings/swift/build-xcframework.sh debug
      - name: macOS で、SwiftPM で作ったラッパーを通しても、ネイティブと同じハッシュの一覧になることを確かめる
        working-directory: bindings/swift
        run: swift run ZumenConformance "$GITHUB_WORKSPACE"
      - name: iOS のシミュレーターで、同じことを確かめる
        run: sh bindings/swift/test-simulator.sh
