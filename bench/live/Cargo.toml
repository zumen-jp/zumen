# 文書エンジンのコアと試作（docs/live.md）を、今の実装の apply と照らし、速さを測る。
# コアのワークスペースには入れない。
[package]
name = "zumen-bench-live"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[lib]
name = "zumen_bench_live"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "live"
path = "src/main.rs"

[[bin]]
name = "core-live"
path = "src/core_live.rs"

[dependencies]
libm = { version = "0.2.16", default-features = false }
zumen = { path = "../../crates/zumen" }
zumen-acad = { path = "../../crates/zumen-acad" }
zumen-base = { path = "../../crates/zumen-base" }
zumen-drawing = { path = "../../crates/zumen-drawing" }
zumen-jww = { path = "../../crates/zumen-jww" }
zumen-live = { path = "../../crates/zumen-live" }
zumen-scene = { path = "../../crates/zumen-scene" }
zumen-sdk = { path = "../../crates/zumen-sdk" }
zumen-sxf = { path = "../../crates/zumen-sxf" }
