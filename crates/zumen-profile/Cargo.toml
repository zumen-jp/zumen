[package]
name = "zumen-profile"
description = "zumen のプロファイルの照合。図面・建物の値を、版つきの規則と語彙と比べる"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[features]
default = []
building = ["dep:zumen-building", "dep:zumen-crs", "dep:zumen-geom3d", "dep:blake3"]
building-drawing = ["building", "zumen-building/drawing", "dep:zumen-geom2d"]

[dependencies]
# 縮尺の分母を仮数と 10 の累乗に分ける対数（決定 0007）。どの対象でも同じ値にする
libm = { version = "0.2.16", default-features = false }
zumen-base = { version = "0.3.0", path = "../zumen-base" }
zumen-drawing = { version = "0.3.0", path = "../zumen-drawing" }
zumen-json = { version = "0.3.0", path = "../zumen-json" }
zumen-building = { version = "0.3.0", path = "../zumen-building", features = ["measure"], optional = true }
zumen-crs = { version = "0.3.0", path = "../zumen-crs", optional = true }
zumen-geom3d = { version = "0.3.0", path = "../zumen-geom3d", optional = true }
zumen-geom2d = { version = "0.3.0", path = "../zumen-geom2d", optional = true }
blake3 = { version = "1.8.2", default-features = false, features = ["pure"], optional = true }

[dev-dependencies]
# 建具の属性から作図プロファイルの記号までを、合成 IFC で照らす（tests/ifc_door.rs）。
# zumen-ifc の側から zumen-profile の feature を有効にすると、配る SBOM に実ビルドにない辺が載る
zumen-ifc = { path = "../zumen-ifc" }
zumen-sdk = { path = "../zumen-sdk" }
# 切り出した図面を、convert と同じ書き手で新しい DXF・SXF（P21）・JWW に書く試験（#397）
zumen-acad = { path = "../zumen-acad" }
zumen-jww = { path = "../zumen-jww" }
zumen-sxf = { path = "../zumen-sxf" }

[lints]
workspace = true

[[example]]
name = "building_contract"
required-features = ["building"]

[[example]]
name = "drawing_contract"
required-features = ["building-drawing"]
