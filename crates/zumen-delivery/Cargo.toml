[package]
name = "zumen-delivery"
description = "zumen の電子納品の成果品（フォルダー・管理ファイル）の読み取り（決定 0241、#383）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[package.metadata.zumen]
formats = ["delivery"]

[dependencies]
# 管理ファイルの文字が JIS X 0208 にあるかを、Shift_JIS に直して確かめる
encoding_rs = "0.8.35"
zumen-base = { version = "0.2.0", path = "../zumen-base" }
zumen-json = { version = "0.2.0", path = "../zumen-json" }
zumen-photo = { version = "0.2.0", path = "../zumen-photo" }
zumen-profile = { version = "0.2.0", path = "../zumen-profile" }
zumen-sdk = { version = "0.2.0", path = "../zumen-sdk" }
zumen-xml = { version = "0.2.0", path = "../zumen-xml" }
zumen-zip = { version = "0.2.0", path = "../zumen-zip" }

[lints]
workspace = true

[dev-dependencies]
zumen-base = { path = "../zumen-base" }
zumen-zip = { path = "../zumen-zip" }
