[package]
name = "zumen-drawing"
description = "zumen の図面の領域モデル（L2）。形式に依存しない"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
# 要素のハッシュ（決定 0156）。CC0-1.0 OR Apache-2.0。C と asm を使わない pure で、どの対象でも同じ値になる
blake3 = { version = "1.8.2", default-features = false, features = ["pure"] }
# 変換の三角関数（決定 0007）。どの対象でも同じ値にする
libm = { version = "0.2.16", default-features = false }
zumen-base = { version = "0.2.0", path = "../zumen-base" }
# 実寸の空間の軸の並び（決定 0019）
zumen-crs = { version = "0.2.0", path = "../zumen-crs" }

[features]
# 図面モデルのバイナリ（決定 0246）。使う側が入れる。xtask は入れないので、型を変えて生成した読み書きが古くなっても、
# codegen を流せる
binary = []
# 試験のための乱数の図面（binary::random）
random = ["binary"]

[lints]
workspace = true
