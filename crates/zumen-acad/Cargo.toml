[package]
name = "zumen-acad"
description = "zumen の AutoCAD の系統のファイルモデル（L1）と、そのコーデック"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.zumen]
formats = ["dxf", "dwg"]

[dependencies]
zumen-base = { path = "../zumen-base" }
zumen-sdk = { path = "../zumen-sdk" }
zumen-drawing = { path = "../zumen-drawing", optional = true }
# 2007 より前の版の Shift_JIS（ANSI_932）の文字を戻す。WHATWG の Shift_JIS で、環境によらない（決定 0175）
encoding_rs = { version = "0.8.35", optional = true }

[features]
default = ["drawing"]
# DXF から図面モデル（L2）への変換。L1 だけを使うなら外せる
drawing = ["dep:zumen-drawing", "dep:encoding_rs"]

[dev-dependencies]
libm = { version = "0.2.16", default-features = false }
zumen-drawing = { path = "../zumen-drawing" }

[lints]
workspace = true
