[package]
name = "zumen-xml"
description = "zumen の XML の L0（決定 0209）。要素・属性・文字と名前空間を、元のバイト範囲で読む"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
zumen-base = { version = "0.2.0", path = "../zumen-base" }
zumen-sdk = { version = "0.2.0", path = "../zumen-sdk" }
# Shift_JIS の文書の文字を戻し、文字コードの名前を引く。WHATWG の定義で、環境によらない（決定 0121）
encoding_rs = "0.8.35"

[lints]
workspace = true
