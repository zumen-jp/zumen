[package]
name = "zumen-crs"
description = "zumen の座標系と標高（決定 0019）。空間ごとの座標の型、平面直角座標の換算、ジオイドの格子の補間"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[package.metadata.zumen]
formats = ["isg", "par"]

[dependencies]
# 換算の三角関数と双曲線関数（決定 0007）。どの対象でも同じ値にする
libm = { version = "0.2.16", default-features = false }
zumen-base = { version = "0.2.1", path = "../zumen-base" }
zumen-sdk = { version = "0.2.1", path = "../zumen-sdk" }

[dev-dependencies]
# TKY2JGD・PatchJGD の格子の読みと補間を、テストの中で作った格子で照らす外部の実装（決定 0286、#670）。
# MIT OR Apache-2.0 で、既定の feature では依存を持たない。wasm32 でも組み立てられる。std の HashMap・hypot と、
# target の FMA で変わる積和を使うが、テストは hypot を使う関数を呼ばず、照らす値を作るだけで、配る成果物には
# 入らない（決定 0269・0279）
jgdtrans = { version = "0.3.1", default-features = false }

[lints]
workspace = true
