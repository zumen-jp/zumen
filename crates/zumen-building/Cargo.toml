[package]
name = "zumen-building"
description = "zumen の建物モデル（L2、決定 0207）。要素とコンポーネント、ID とハッシュ、配置の連鎖、関係の索引"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[features]
default = []
drawing = ["dep:zumen-drawing", "dep:zumen-geom2d", "dep:zumen-crs"]

[dependencies]
zumen-base = { version = "0.2.0", path = "../zumen-base" }
zumen-geom3d = { version = "0.2.0", path = "../zumen-geom3d" }
zumen-drawing = { version = "0.2.0", path = "../zumen-drawing", optional = true }
zumen-geom2d = { version = "0.2.0", path = "../zumen-geom2d", optional = true }
zumen-crs = { version = "0.2.0", path = "../zumen-crs", optional = true }
libm = { version = "0.2.16", default-features = false }
# 要素のハッシュ（決定 0156）。C と asm を使わない pure の機能だけを使う
blake3 = { version = "1.8.2", default-features = false, features = ["pure"] }

[lints]
workspace = true

[[example]]
name = "drawing_contract"
required-features = ["drawing"]
