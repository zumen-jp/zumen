[package]
name = "zumen-sheet"
description = "zumen の表（Excel の xlsx と CSV）の読み取り（#391）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[package.metadata.zumen]
formats = ["xlsx", "csv"]

[dependencies]
encoding_rs = "0.8.35"
zumen-base = { version = "0.2.0", path = "../zumen-base" }
zumen-sdk = { version = "0.2.0", path = "../zumen-sdk" }
zumen-xml = { version = "0.2.0", path = "../zumen-xml" }
zumen-zip = { version = "0.2.0", path = "../zumen-zip" }

[lints]
workspace = true

[dev-dependencies]
zumen-base = { path = "../zumen-base" }
zumen-zip = { path = "../zumen-zip" }
