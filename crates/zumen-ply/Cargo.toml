[package]
name = "zumen-ply"
description = "zumen の PLY の点群の読み取りと、点群の領域モデルへの移し（#373）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[package.metadata.zumen]
formats = ["ply"]

[dependencies]
# 強度の丸め（決定 0007）。どの対象でも同じ値にする
libm = { version = "0.2.16", default-features = false }
zumen-base = { version = "0.3.0", path = "../zumen-base" }
zumen-pointcloud = { version = "0.3.0", path = "../zumen-pointcloud" }
zumen-sdk = { version = "0.3.0", path = "../zumen-sdk" }

[lints]
workspace = true

[dev-dependencies]
# 独立した PLY の読みと照合する（#809）。MIT、crates.io。wasm の tests も組み立てられる。
# 公開・合成の有限の値だけを、頂点の順と列名で比較し、HashMap の列挙順を使わない。
# build の skeptic と間接依存も寛容なライセンス。配布物の実装にはリンクしない。
ply-rs = "=0.1.3"
