[package]
name = "zumen-abi"
description = "zumen の境界: 各言語から呼ぶ C ABI と wasm の関数と、スキーマで定めたメッセージ"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

# ライブラリのファイル名に ABI の大版を入れる（zumen_abi1.dll・libzumen_abi1.so・libzumen_abi1.dylib、決定 0015）
[lib]
name = "zumen_abi1"
crate-type = ["cdylib", "staticlib", "rlib"]

# wasm のモジュール（決定 0013・0221）。名前は schema/boundary.toml の modules と同じ。ネイティブのライブラリと CLI は、
# すべてを入れる
[features]
default = ["drawing", "bim"]
drawing = []
bim = []
# プラグインのモジュールの土台（決定 0247）。プラグインの形式だけを読み、lift で図面モデルのバイナリにする
plugin = []

[dependencies]
# 三角関数を、どの環境でも同じ値で求める（決定 0007・0118）。環境ごとの命令を使わない
libm = { version = "0.2.16", default-features = false }
zumen-acad = { version = "0.2.0", path = "../zumen-acad" }
zumen-asbuilt = { version = "0.2.0", path = "../zumen-asbuilt" }
zumen-base = { version = "0.2.0", path = "../zumen-base" }
# 図面モデルのバイナリ（決定 0247）で、プラグインが読んだ図面を文書として受け渡す
zumen-drawing = { version = "0.2.0", path = "../zumen-drawing", features = ["binary"] }
# 横と縦の尺度の違うビューの曲線を、用紙の折れ線にする（決定 0238）
zumen-geom2d = { version = "0.2.0", path = "../zumen-geom2d" }
zumen-json = { version = "0.2.0", path = "../zumen-json" }
zumen-profile = { version = "0.2.0", path = "../zumen-profile" }
zumen-review = { version = "0.2.0", path = "../zumen-review" }
zumen-scene = { version = "0.2.0", path = "../zumen-scene" }
zumen-jww = { version = "0.2.0", path = "../zumen-jww" }
zumen-bcf = { version = "0.2.0", path = "../zumen-bcf" }
zumen-civil = { version = "0.2.0", path = "../zumen-civil" }
# 土木の線形から図面モデルを作る（決定 0239）
zumen-civil-drawing = { version = "0.2.0", path = "../zumen-civil-drawing" }
zumen-crs = { version = "0.2.0", path = "../zumen-crs" }
zumen-landxml = { version = "0.2.0", path = "../zumen-landxml" }
zumen-citygml = { version = "0.2.0", path = "../zumen-citygml" }
zumen-delivery = { version = "0.2.0", path = "../zumen-delivery" }
zumen-geo = { version = "0.2.0", path = "../zumen-geo" }
zumen-geom3d = { version = "0.2.0", path = "../zumen-geom3d" }
zumen-las = { version = "0.2.0", path = "../zumen-las" }
zumen-ply = { version = "0.2.0", path = "../zumen-ply" }
zumen-pointcloud = { version = "0.2.0", path = "../zumen-pointcloud" }
zumen-e57 = { version = "0.2.0", path = "../zumen-e57" }
zumen-xyz = { version = "0.2.0", path = "../zumen-xyz" }
zumen-building = { version = "0.2.0", path = "../zumen-building" }
zumen-ifc = { version = "0.2.0", path = "../zumen-ifc" }
zumen-ids = { version = "0.2.0", path = "../zumen-ids" }
zumen-sxf = { version = "0.2.0", path = "../zumen-sxf" }
zumen-photo = { version = "0.2.0", path = "../zumen-photo" }
zumen-sheet = { version = "0.2.0", path = "../zumen-sheet" }
zumen-geology = { version = "0.2.0", path = "../zumen-geology" }
zumen-sdk = { version = "0.2.0", path = "../zumen-sdk" }
# P2Z・SFZ の書庫を読み書きする（#385）
zumen-zip = { version = "0.2.0", path = "../zumen-zip" }

[dev-dependencies]
# 試験で、乱数の図面モデルをバイナリにして渡す（決定 0247）
zumen-drawing = { path = "../zumen-drawing", features = ["random"] }

[lints]
workspace = true
