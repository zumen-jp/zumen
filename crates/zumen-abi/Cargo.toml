[package]
name = "zumen-abi"
description = "zumen の境界: 各言語から呼ぶ C ABI と wasm の関数と、スキーマで定めたメッセージ"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# ライブラリのファイル名に ABI の大版を入れる（zumen_abi1.dll・libzumen_abi1.so・libzumen_abi1.dylib、決定 0015）
[lib]
name = "zumen_abi1"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# 三角関数を、どの環境でも同じ値で求める（決定 0007・0118）。環境ごとの命令を使わない
libm = { version = "0.2.16", default-features = false }
zumen-acad = { path = "../zumen-acad" }
zumen-base = { path = "../zumen-base" }
zumen-drawing = { path = "../zumen-drawing" }
zumen-json = { path = "../zumen-json" }
zumen-jww = { path = "../zumen-jww" }
zumen-sxf = { path = "../zumen-sxf" }
zumen-sdk = { path = "../zumen-sdk" }

[lints]
workspace = true
