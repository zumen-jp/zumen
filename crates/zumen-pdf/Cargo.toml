[package]
name = "zumen-pdf"
description = "zumen の PDF のファイルモデル（L1）と、そのコーデック"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# #521 など（hayro の中の展開・再帰・フォントの読みを予算で止めること）を直すまで、crates.io に出さない（決定 0289）
publish = false

[package.metadata.zumen]
formats = ["pdf"]

[dependencies]
zumen-base = { version = "0.2.1", path = "../zumen-base" }
zumen-sdk = { version = "0.2.1", path = "../zumen-sdk" }
zumen-drawing = { version = "0.2.1", path = "../zumen-drawing", optional = true }
# ページの内容の解釈（決定 0256）。塗った順に要素の ID を振り、色空間の Debug の表記で系統を見分けるので、バージョンを固定する。
# 上げるのは読み取りの変更として扱う。埋め込みのないフォントと CMap は、同梱のもの（既定の機能）で読む
hayro-interpret = { version = "=0.9.0", optional = true }
# hayro-interpret が使う crate のうち、結果と ID を決めるもの（字句・フォント・CMap・経路）も、バージョンを固定する。
# 内容のストリームの走査とフォントの読みは、hayro-interpret と同じ crate で行う
hayro-syntax = { version = "=0.9.0", default-features = false, optional = true }
hayro-font = { version = "=0.5.0", default-features = false, optional = true }
hayro-cmap = { version = "=0.1.1", default-features = false, optional = true }
kurbo = { version = "=0.13.1", default-features = false, optional = true }
# 壊れた Flate のストリームを見つける。hayro-syntax は展開できない所から後ろを黙って捨てるので、hayro-syntax と同じ
# crate と backend で厳しく展開し直す
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"], optional = true }
# コードからは使わない。hayro-interpret は ICC のプロファイルを moxcms で読み、読めなければ代わりの色空間
# （Alternate）にするので、色空間の系統と色の診断がバージョンで変わりうる。そのためバージョンを固定する
moxcms = { version = "=0.8.1", default-features = false, optional = true }
# hayro-font はフォントのプログラムを skrifa（と read-fonts）で読み、Widths のない TrueType の送りを決めるので、
# 文字の分け方と ID がバージョンで変わりうる。そのためバージョンを固定する。走査は、フォントのプログラムの手間を数えるときに、
# hayro-font と同じ表を見るよう skrifa で読む。read-fonts は、コードからは使わない
skrifa = { version = "=0.49.0", default-features = false, optional = true }
read-fonts = { version = "=0.46.0", default-features = false, optional = true }
# 文字の向きと斜体の角度。std の三角関数は環境で値が違いうる（決定 0007）
libm = { version = "0.2.16", default-features = false, optional = true }

[features]
default = ["drawing"]
# 図面モデル（L2）への変換。L1 だけを使うなら外せる
drawing = [
    "dep:zumen-drawing",
    "dep:hayro-interpret",
    "dep:hayro-syntax",
    "dep:hayro-font",
    "dep:hayro-cmap",
    "dep:kurbo",
    "dep:flate2",
    "dep:moxcms",
    "dep:skrifa",
    "dep:read-fonts",
    "dep:libm",
]

[dev-dependencies]
zumen-drawing = { path = "../zumen-drawing" }
zumen-scene = { path = "../zumen-scene" }
# 別のプログラムで呼ぶ pdf.js の照合結果を読む。既存の JSON の読み取りを使う
zumen-json = { path = "../zumen-json" }

[lints]
workspace = true
