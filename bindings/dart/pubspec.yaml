name: zumen
description: 図面の読み書きと変換に使う zumen の Dart ラッパーです。dart:ffi でネイティブのライブラリを呼び、図面の要素や描画用の座標を取り出せます。
repository: https://github.com/zumen-jp/zumen/tree/main/bindings/dart
issue_tracker: https://github.com/zumen-jp/zumen/issues
version: 0.4.0
# dart_package.py がライセンス本文を加えた配布物に公開先を設定する。
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  ffi: '>=2.0.2 <3.0.0'

dev_dependencies:
  crypto: ^3.0.3
