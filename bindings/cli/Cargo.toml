[package]
name = "zumen-cli"
description = "zumen の CLI と、標準入出力の JSON-RPC と MCP のサーバー（決定 0013・0197）"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true

# 実行ファイルの名前は zumen（決定 0013・0014）
[[bin]]
name = "zumen"
path = "src/main.rs"

[dependencies]
zumen-abi = { version = "0.2.0", path = "../../crates/zumen-abi" }
zumen-base = { version = "0.2.0", path = "../../crates/zumen-base" }
zumen-json = { version = "0.2.0", path = "../../crates/zumen-json" }
zumen-scene = { version = "0.2.0", path = "../../crates/zumen-scene" }

[dev-dependencies]
zumen-conformance = { path = "../conformance" }

[lints]
workspace = true
