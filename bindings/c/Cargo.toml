[package]
name = "zumen-c"
description = "C のヘッダーと C++ のラッパー（include/）を、C と C++ のコンパイラーで確かめ、適合テストを流すテスト。成果物には入らない"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
zumen-abi = { path = "../../crates/zumen-abi" }

# 適合テストの組を、C と C++ の側に渡して流す（決定 0198）
[dev-dependencies]
zumen-conformance = { path = "../conformance" }
zumen-json = { path = "../../crates/zumen-json" }
zumen-scene = { path = "../../crates/zumen-scene" }

# テストの C と C++ を組み立てる。MIT OR Apache-2.0。ビルドのツールで、成果物には何も残さない（決定 0011）
[build-dependencies]
cc = "1.10.0"

[lints.rust]
unsafe_code = "allow"
